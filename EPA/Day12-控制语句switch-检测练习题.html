<script>

const QUIZ_KEY = 'wrongbank_day12';

const DAY_NUM = 12;



const allQuestions = [{"id": 1, "type": "single", "kp": "switch语法", "text": "switch 语句的表达式不能是以下哪种类型？", "options": ["int", "char", "float", "short"], "correct": "C", "expl": "<strong>switch 表达式只能是整型</strong>：int/char/short/long/enum。不能是 float、double 或字符串。"}, {"id": 2, "type": "single", "kp": "switch语法", "text": "case 后面必须是什么？", "options": ["变量", "常量", "表达式", "任意值"], "correct": "B", "expl": "<strong>case 后面必须是常量</strong>（字面量或 const 常量），不能是变量。"}, {"id": 3, "type": "single", "kp": "break作用", "text": "switch 中 break 的作用是？", "options": ["结束当前case", "跳出整个switch", "跳到下一个case", "重新开始"], "correct": "B", "expl": "<strong>break 跳出整个 switch 结构</strong>。99% 的 case 后面都要加 break。"}, {"id": 4, "type": "single", "kp": "case穿透", "text": "如果 case 2 匹配成功但没有 break，会发生什么？", "options": ["程序结束", "只执行case 2", "继续执行case 3及之后的case", "跳回case 1"], "correct": "C", "expl": "<strong>没有 break 会发生穿透</strong>：从匹配到的 case 开始，一直往后执行所有 case，直到遇到 break 或 switch 结束。"}, {"id": 5, "type": "single", "kp": "default", "text": "关于 default 分支，说法正确的是？", "options": ["必须写在最后", "必须写", "处理所有case都不匹配的情况", "不能包含break"], "correct": "C", "expl": "<strong>default 处理所有 case case</strong>。位置可以任意，默认处理所有 case case case。"}, {"id": 6, "type": "single", "kp": "switch vs if", "text": "以下哪个场景最适合用 switch？", "options": ["判断a是否在10到20之间", "判断score的等级（ABCD）", "判断两个数的大小", "判断字符串是否相等"], "correct": "B", "expl": "<strong>成绩等级</strong>适合用 switch（可以用 score/10 技巧）。范围判断、字符串比较只能用 if。"}, {"id": 7, "type": "single", "kp": "switch vs if", "text": "以下哪个场景只能用 if 不能用 switch？", "options": ["判断星期几", "判断运算符+/-/*//", "判断a>10", "判断菜单选项1-5"], "correct": "C", "expl": "<strong>范围判断（a>10）</strong>只能用 if。switch 只能判断\"等于某个离散值\"，不能判断范围。"}, {"id": 8, "type": "single", "kp": "case穿透", "text": "多个 case 共用一组语句时，正确的写法是？", "options": ["case 1,2,3:", "case 1: case 2: case 3:", "case 1 or 2 or 3:", "case [1,2,3]:"], "correct": "B", "expl": "<strong>case 1: case 2: case 3:</strong> 正确写法。多个 case 写在一起利用穿透特性。注意不要写成 case 1,2,3:（这是错的）。"}, {"id": 9, "type": "single", "kp": "常见错误", "text": "以下哪个是 switch 的常见错误？", "options": ["case 后加 break", "default 写在最后", "忘记写 break", "用 char 做表达式"], "correct": "C", "expl": "<strong>忘记写 break</strong> 是最常见最隐蔽的错误。其他三个都是正确的做法。"}, {"id": 10, "type": "single", "kp": "常见错误", "text": "switch(n); { case 1: printf(\"A\"); break; } 会有什么问题？", "options": ["语法错误", "case 1 永远不会执行", "正常执行", "switch 表达式错误"], "correct": "B", "expl": "<strong>分号陷阱！</strong>switch(n); 后面的分号让 switch 的语句体变成空语句。后面的 { case 1: ... } 是独立代码块，与 switch 无关，case 1 永远不会匹配。"}, {"id": 11, "type": "single", "kp": "成绩等级", "text": "用 switch 判断成绩等级时，如何把 0-100 的分数变成离散值？", "options": ["score % 10", "score / 10", "score * 10", "score - 10"], "correct": "B", "expl": "<strong>score / 10（整数除法）</strong>把分数变成 0-10 的离散值。95/10=9，85/10=8，这样就可以用 switch 判断了。"}, {"id": 12, "type": "single", "kp": "char表达式", "text": "关于 switch(op) 中 op 是 char 类型，说法正确的是？", "options": ["语法错误", "可以，因为 char 本质是整型（ASCII码）", "必须转成 int 才行", "只有部分字符可以"], "correct": "B", "expl": "<strong>char 可以用于 switch</strong>，因为 char 本质上是整型（存储的是 ASCII 码）。case 后面可以写字符常量如 case '+':。"}, {"id": 13, "type": "judge", "kp": "switch语法", "text": "switch 的表达式可以是 float 类型。", "correct": "B", "options": ["正确", "错误"], "expl": "<strong>错误！</strong>switch 表达式只能是整型（int/char/short/long/enum），不能是 float/double/字符串。"}, {"id": 14, "type": "judge", "kp": "break作用", "text": "每个 case 后面都必须写 break。", "correct": "B", "options": ["正确", "错误"], "expl": "<strong>不是必须！</strong>99% 的情况需要写 break，但当多个 case 共用一组语句时可以故意不写 break（穿透）。但建议大多数情况都写。"}, {"id": 15, "type": "judge", "kp": "default", "text": "default 分支只能写在所有 case 的最后。", "correct": "B", "options": ["正确", "错误"], "expl": "<strong>错误！</strong>default 可以写在 switch 内的任何位置。但强烈建议写在最后，这是行业惯例。"}, {"id": 16, "type": "judge", "kp": "case穿透", "text": "case 穿透是 bug，绝对不能利用。", "correct": "B", "options": ["正确", "错误"], "expl": "<strong>错误！</strong>意外穿透是 bug，但故意利用穿透可以让多个 case 共用一组语句，这是正确的用法，代码更简洁。"}, {"id": 17, "type": "judge", "kp": "常见错误", "text": "switch 后不能多写分号，否则会导致逻辑错误。", "correct": "A", "options": ["正确", "错误"], "expl": "<strong>正确！</strong>switch(n); 后面的分号让 switch 的语句体变成空语句，后面的代码块与 switch 无关，导致逻辑错误。"}, {"id": 18, "type": "fill", "kp": "switch语法", "text": "switch 语句中，用于跳出整个结构的关键字是 <input class=\"fill-blank\" data-idx=\"0\" placeholder=\"?\">，处理所有 case 都不匹配的分支是 <input class=\"fill-blank\" data-idx=\"1\" placeholder=\"?\">。", "correct": ["break", "default"], "correctText": "break | default", "expl": "<strong>break</strong> 用于跳出 switch，<strong>default</strong> 处理所有 case 都不匹配的情况。"}, {"id": 19, "type": "fill", "kp": "case穿透", "text": "匹配到 case 后，如果没有 break，会继续执行后面的 case，这个特性叫做 <input class=\"fill-blank\" data-idx=\"0\" placeholder=\"?\">（英文单词）。", "correct": ["fall-through", "fallthrough"], "correctText": "fall-through", "expl": "<strong>fall-through</strong>（穿透）：匹配到 case 后继续执行后面的 case。"}, {"id": 20, "type": "fill", "kp": "成绩等级", "text": "判断成绩等级时，用 score <input class=\"fill-blank\" data-idx=\"0\" placeholder=\"运算符\"> 10（整数运算）把分数变成 0-10 的离散值。", "correct": ["/"], "correctText": "/", "expl": "<strong>/</strong> 整数除法：score/10 把 0-100 变成 0-10 的离散值，方便用 switch 判断。"}];

 输出：星期一\n输入 7 → 输出：星期日\n输入其他 → 输出：无效", "hint": "switch(day) { case 1: printf(\"星期一\"); break; ... }", "answer": "#include <stdio.h>\nint main() {\n    int day;\n    scanf(\"%d\", &day);\n    switch (day) {\n        case 1: printf(\"星期一\\n\"); break;\n        case 2: printf(\"星期二\\n\"); break;\n        case 3: printf(\"星期三\\n\"); break;\n        case 4: printf(\"星期四\\n\"); break;\n        case 5: printf(\"星期五\\n\"); break;\n        case 6: printf(\"星期六\\n\"); break;\n        case 7: printf(\"星期日\\n\"); break;\n        default: printf(\"无效\\n\"); break;\n    }\n    return 0;\n}", "test_input": "3", "expected_output": "星期三"}, {"id": 102, "type": "coding", "kp": "switch基础", "difficulty": "入门", "title": "简单计算器", "desc": "编写程序，输入两个整数和一个运算符（+、-、*、/），用 switch 计算并输出结果。\n例：输入 3 + 5 → 输出：3 + 5 = 8\n除法要考虑除数为0的情况，且结果保留2位小数。", "hint": "用 char op 存运算符，switch(op) 判断。除法用 (float)a/b 转成浮点。", "answer": "#include <stdio.h>\nint main() {\n    int a, b;\n    char op;\n    scanf(\"%d %c %d\", &a, &op, &b);\n    switch (op) {\n        case '+': printf(\"%d + %d = %d\\n\", a, b, a+b); break;\n        case '-': printf(\"%d - %d = %d\\n\", a, b, a-b); break;\n        case '*': printf(\"%d * %d = %d\\n\", a, b, a*b); break;\n        case '/':\n            if (b == 0) printf(\"除数不能为0\\n\");\n            else printf(\"%d / %d = %.2f\\n\", a, b, (float)a/b);\n            break;\n        default: printf(\"无效运算符\\n\"); break;\n    }\n    return 0;\n}", "test_input": "10 / 3", "expected_output": "10 / 3 = 3.33"}, {"id": 103, "type": "coding", "kp": "case穿透", "difficulty": "简单", "title": "输出月份天数", "desc": "编写程序，输入月份（1-12），用 switch 输出该月有多少天（2月按28天算）。\n要求：利用 case 穿透特性，把天数相同的月份写在一起。\n例：输入 3 → 输出：31天", "hint": "1/3/5/7/8/10/12月都是31天，4/6/9/11月都是30天，2月单独处理。", "answer": "#include <stdio.h>\nint main() {\n    int month, days;\n    scanf(\"%d\", &month);\n    switch (month) {\n        case 1: case 3: case 5: case 7:\n        case 8: case 10: case 12:\n            days = 31; break;\n        case 4: case 6: case const extraQuestions = [];



let currentQuestions = [];

let currentQIndex = 0;

let answers = {};
let submitted = {};

let currentMode = 'normal';

const PROGRESS_KEY = QUIZ_KEY + '_progress';



function getWrongBank(){

  try{return JSON.parse(localStorage.getItem(QUIZ_KEY)||'[]')}catch(e){return []}

}

function saveWrongBank(list){

  localStorage.setItem(QUIZ_KEY, JSON.stringify(list));

}

function addToWrongBank(q, userAns){

  const bank = getWrongBank();

  if(!bank.find(x=>x.id===q.id)){

    bank.push({

      id:q.id,type:q.type,kp:q.kp,text:q.text,

      options:q.options,correct:q.correct,correctText:q.correctText,

      expl:q.expl,userAns:userAns,time:Date.now()

    });

    saveWrongBank(bank);

  }

}

function saveProgress(){

  if(currentMode==='review') return;

  const prog = {

    mode:currentMode, index:currentQIndex, answers:answers,

    ids:currentQuestions.map(q=>q.id), time:Date.now()

  };

  localStorage.setItem(PROGRESS_KEY, JSON.stringify(prog));

}

function loadProgress(){

  try{return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null')}catch(e){return null}

}

function clearProgress(){

  localStorage.removeItem(PROGRESS_KEY);

}

function shuffle(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}

  const code = q.answer || q.hint || '// 请在此编写代码';

  const blob = new Blob([code], {type: 'text/plain'});

  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');

  a.href = url;

  a.download = `Day${DAY_NUM}_${q.id}.c`;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);

  

  // 显示提示

  const info = document.createElement('div');

  info.className = 'vscode-info';

 Open File → 选择下载的 ${a.download}</code><br>或按快捷键 <code>Ctrl+O</code>`;

  const container = document.getElementById('quizContainer');

  const oldInfo = container.querySelector('.vscode-info');

  if (oldInfo) oldInfo.remove();

  container.querySelector('.question-card').appendChild(info);

function startQuiz(mode){

  clearProgress();

  currentMode = mode;

  currentQIndex = 0;

  answers = {};

  submitted = {};

  document.getElementById('resultCard').classList.remove('show');

  document.getElementById('reviewArea').style.display = 'none';

  document.getElementById('quizArea').style.display = 'block';

  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));

  const tabMap = {normal:0, coding:1, wrongredo:2, review:3};

  if(tabMap[mode]!==undefined) document.querySelectorAll('.mode-tab')[tabMap[mode]].classList.add('active');



  if(mode==='coding'){

    currentQuestions = [...codingQuestions];

  } else if(mode==='wrongredo'){

    const bank = getWrongBank();

    if(bank.length===0){

      alert('错题库为空，没有错题可以重做！');

      switchMode('normal');

      return;

    }

    currentQuestions = bank.map(w=>({...w, isWrongRedo:true}));

  } else if(mode==='consolidate'){

    const bank = getWrongBank();

    if(bank.length===0){

      alert('错题库为空，先去做题吧！');

      switchMode('normal');

      return;

    }

    const weakKps = [...new Set(bank.map(w=>w.kp))];

    let pool = allQuestions.filter(q=>weakKps.includes(q.kp) && !bank.find(w=>w.id===q.id));

    if(pool.length<5) pool = allQuestions.filter(q=>!bank.find(w=>w.id===q.id));

    currentQuestions = shuffle(pool).slice(0, Math.min(10, pool.length));

  } else {

    currentQuestions = [...allQuestions];

  }



  if(currentQuestions.length===0){

    alert('没有题目！');

    return;

  }

  renderQuestion();

}



function switchMode(mode){

  if(mode==='review'){

    document.getElementById('quizArea').style.display='none';

    document.getElementById('resultCard').classList.remove('show');

    document.getElementById('reviewArea').style.display='block';

    document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));

    document.querySelectorAll('.mode-tab')[3].classList.add('active');

    currentMode='review';

    renderReview();

    return;

  }

  startQuiz(mode);

}

function selectOption(label, e){

  const q = currentQuestions[currentQIndex];

  answers[q.id] = label;

  document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));

  e.currentTarget.classList.add('selected');

}



function showHint(){

  document.getElementById('hintBox').classList.toggle('show');

}

function showAnswerCoding(){

  document.getElementById('answerDisplay').classList.toggle('show');

}



function submitQ(){

  const q = currentQuestions[currentQIndex];

  let userAns = answers[q.id];

  let isCorrect = false;



  if(q.type==='fill'){

    const inputs = document.querySelectorAll('.fill-blank');

    userAns = Array.from(inputs).map(i=>i.value.trim());

    isCorrect = q.correct.every((c,i)=>userAns[i] && userAns[i].toLowerCase()===c.toLowerCase());

    if(!isCorrect) addToWrongBank(q, userAns.join(' | '));

  } else {

    if(!userAns){

      alert('请先选择一个答案！');

      return;

    }

    isCorrect = userAns===q.correct;

    if(!isCorrect) addToWrongBank(q, userAns||'未作答');

  }



  submitted[q.id] = isCorrect;

  saveProgress();

  renderQuestion();

}



function prevQ(){

  if(currentQIndex>0){currentQIndex--;renderQuestion()}

}

function goNext(){
  if(currentQIndex < currentQuestions.length - 1){
    currentQIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
  window.scrollTo(0,0);
}

function nextQ(){

  if(currentQIndex<currentQuestions.length-1){currentQIndex++;renderQuestion()}

  else finishQuiz();

}

      const ual = (ua||[]);

      ok = Array.isArray(ual) && q.correct.every((c,i)=>ual[i] && ual[i].toLowerCase()===c.toLowerCase());

    } else { ok = ua===q.correct; }

    if(ok) correct++; else wrongList.push({q,userAns:Array.isArray(ua)?ua.join(' | '):(ua||'未作答')});

  });



  const total = currentQuestions.filter(q=>q.type!=='coding').length;

  const wrong = total - correct;

  const score = total>0 ? Math.round(correct/total*100) : 0;



  document.getElementById('quizArea').style.display='none';

  document.getElementById('resultCard').classList.add('show');

  document.getElementById('score').textContent = score;

  document.getElementById('score').style.color = score>=90?'#27ae60':score>=60?'#f39c12':'#e74c3c';

  document.getElementById('message').textContent = score>=90?'🎉 太棒了！掌握得很好！':score>=60?'👍 继续努力，还有提升空间！':'💪 基础还需加强，多复习知识点！';

  document.getElementById('correctCount').textContent = correct;

  document.getElementById('wrongCount').textContent = wrong;

  document.getElementById('totalCount').textContent = total;



  if(wrongList.length>0){

    document.getElementById('wrongBankPreview').style.display='block';

    let html='';

    wrongList.forEach(w=>{

      html += `<div class="wrong-item"><div class="wq">${w.q.kp}: ${w.q.text.substring(0,50)}...</div><div class="wa">你的答案: ${w.userAns}</div><div class="wc">正确答案: ${w.q.correctText||w.q.correct}</div></div>`;

    });

    document.getElementById('wrongPreviewList').innerHTML = html;

  } else {

    document.getElementById('wrongBankPreview').style.display='none';

  }

  clearProgress();

}



function renderReview(){

  const bank = getWrongBank();

  document.getElementById('wrongBankCount').textContent = bank.length;

  switchReviewTab('list');

}



function switchReviewTab(tab, e){

  document.querySelectorAll('.review-tab').forEach(t=>t.classList.remove('active'));

  e?.target?.classList.add('active');

  if(!e) document.querySelectorAll('.review-tab')[tab==='list'?0:1].classList.add('active');

  document.getElementById('wrongBankList').style.display = tab==='list'?'block':'none';

  document.getElementById('knowledgeReview').style.display = tab==='knowledge'?'block':'none';

  if(tab==='list') renderWrongList();

  else renderKnowledgeReview();

}



function renderWrongList(){

  const bank = getWrongBank();

  const el = document.getElementById('wrongBankList');

  if(bank.length===0){el.innerHTML='<div class="empty-state">暂无错题，继续加油！</div>';return}

  let html='';

  bank.sort((a,b)=>b.time-a.time).forEach((w,i)=>{

    html += `<div class="kp-section" style="border-left-color:#e74c3c">`;

    html += `<div class="kp-header"><div class="kp-title">${i+1}. ${w.kp}</div>`;

    html += `<button class="btn" style="background:#e74c3c;color:white;padding:3px 10px;font-size:11px" onclick="removeWrong(${w.id})">删除</button></div>`;

    html += `<div class="kp-content">${w.text}</div>`;

    if(w.options){

      html += `<div class="options" style="margin-top:8px">`;

      const labels = w.type==='judge'?['A','B']:['A','B','C','D'];

      w.options.forEach((opt,j)=>{

        const cls = labels[j]===w.correct?'correct':(labels[j]===w.userAns?'wrong':'');

        html += `<div class="option ${cls}" style="cursor:default;pointer-events:none"><span class="option-label">${labels[j]}.</span>${opt}</div>`;

      });

      html += `</div>`;

    }

    html += `<div class="explanation show"><div class="explanation-title">📖 解析</div>${w.expl||''}</div>`;

    html += `</div>`;

  });

  el.innerHTML = html;

}



function removeWrong(id){

  if(!confirm('确定删除这道错题吗？')) return;

  const bank = getWrongBank().filter(w=>w.id!==id);

  saveWrongBank(bank);

  renderReview();

}



function clearWrongBank(){

  if(!confirm('确定清空所有错题吗？此操作不可恢复！')) return;

  saveWrongBank([]);

  renderReview();

}



function renderKnowledgeReview(){

  const bank = getWrongBank();

  const el = document.getElementById('knowledgeReview');

  if(bank.length===0){el.innerHTML='<div class="empty-state">暂无错题，继续加油！</div>';return}



  const kpCount = {};

  bank.forEach(w=>{kpCount[w.kp]=(kpCount[w.kp]||0)+1});

  const sorted = Object.entries(kpCount).sort((a,b)=>b[1]-a[1]);



  let html = `<p style="font-size:13px;color:#666;margin-bottom:12px">按错误频率排序，共 ${sorted.length} 个薄弱知识点</p>`;

  sorted.forEach(([kp,count])=>{

    const info = kpMap[kp] || {title:kp, content:'暂无详细说明，请看教材。'};

    const related = bank.filter(w=>w.kp===kp);

    html += `<div class="kp-section">`;

    html += `<div class="kp-header"><div class="kp-title">${info.title}</div><span class="kp-badge">错 ${count} 次</span></div>`;

    html += `<div class="kp-content">${info.content}</div>`;

    html += `<div class="kp-wrong-list">相关错题：<br>`;

    related.forEach(r=>{

      html += `• ${r.text.substring(0,60)}${r.text.length>60?'...':''}<br>`;

    });

    html += `</div></div>`;

  });

  el.innerHTML = html;

}



window.addEventListener('beforeunload', saveProgress);



(function(){

  const p = loadProgress();

  if(p && p.mode && p.ids && p.ids.length>0 && Date.now()-p.time < 3600000){

    if(confirm('检测到上次未完成的答题进度，是否恢复？')){

      currentMode = p.mode;

      currentQIndex = p.index;

      answers = p.answers || {};

      let pool;

      if(p.mode==='coding') pool = codingQuestions;

      else pool = allQuestions;

      currentQuestions = p.ids.map(id=>pool.find(q=>q.id===id)).filter(Boolean);

      if(currentQuestions.length>0){

        document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));

        const tm = {normal:0,coding:1,wrongredo:2};

        if(tm[p.mode]!==undefined) document.querySelectorAll('.mode-tab')[tm[p.mode]].classList.add('active');

        renderQuestion();

        return;

      }

    }

    clearProgress();

  }

  startQuiz('normal');

})();

</script>
