<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day27 函数传参进阶 · 数组与字符串传参 · 知识卡片</title>
<style>
  :root {
    --bg: #f0f3f8;
    --card-bg: #ffffff;
    --text: #2d3436;
    --text-secondary: #636e72;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --shadow-hover: 0 6px 24px rgba(0,0,0,0.14);
    --radius: 14px;
    --concept: #FF9F43;
    --syntax: #2E86DE;
    --error: #EE5253;
    --pointer: #6C5CE7;
    --application: #10AC84;
    --summary: #FDCB6E;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.5px; }
  .header .badge { font-size: 0.8rem; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 20px; }
  .main-layout { display: flex; gap: 24px; padding: 24px 40px; max-width: 1500px; margin: 0 auto; }
  .content-area { flex: 1; min-width: 0; }
  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;
  }
  .filter-btn {
    padding: 7px 18px; border-radius: 20px; border: 1.5px solid #dfe6e9;
    background: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 500;
    color: var(--text-secondary); transition: var(--transition);
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: #74b9ff; color: #0984e3; }
  .filter-btn.active { background: #0984e3; color: #fff; border-color: #0984e3; }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 22px 24px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    border-left: 5px solid #ccc;
    position: relative;
    overflow: hidden;
    cursor: default;
    animation: fadeIn 0.4s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .card.hidden { display: none; }
  .card .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .card .card-cat {
    font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; opacity: 0.8;
  }
  .card .card-level {
    font-size: 0.7rem; font-weight: 700; padding: 2px 10px;
    border-radius: 10px; background: #ffeaa7; color: #d63031;
  }
  .card .card-level.key { background: #fab1a0; color: #b71c1c; }
  .card .card-level.important { background: #ffeaa7; color: #d63031; }
  .card .card-name {
    font-size: 1.05rem; font-weight: 700; margin-bottom: 8px;
    color: var(--text);
  }
  .card .card-key {
    font-family: "JetBrains Mono", "Fira Code", "Consolas", "Courier New", monospace;
    font-size: 0.88rem; background: #f8f9fa; padding: 6px 10px;
    border-radius: 6px; color: #2d3436; margin-bottom: 10px;
    display: inline-block; word-break: break-all;
  }
  .card .card-desc { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.65; margin-bottom: 10px; }
  .card .card-memo {
    font-size: 0.8rem; padding: 8px 12px; background: #fff9e6; border-radius: 8px;
    border-left: 3px solid #f9ca24; color: #6d5c00; line-height: 1.5;
  }
  .card .card-memo.error-memo { background: #fff0f0; border-left-color: #e74c3c; color: #8b0000; }
  .card .card-memo.pointer-memo { background: #f3efff; border-left-color: #6C5CE7; color: #3d2e8f; }
  .side-panel {
    width: 260px; flex-shrink: 0;
    position: sticky; top: 100px; align-self: flex-start;
  }
  .panel-card {
    background: var(--card-bg); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .panel-card h3 { font-size: 0.95rem; margin-bottom: 14px; color: #2d3436; }
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.85rem;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .stat-num { font-weight: 700; }
  .reset-btn {
    width: 100%; padding: 10px; border: 1.5px solid #dfe6e9; border-radius: 10px;
    background: #fff; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary);
    transition: var(--transition); margin-top: 8px;
  }
  .reset-btn:hover { border-color: #0984e3; color: #0984e3; }
  @media (max-width: 1100px) {
    .main-layout { flex-direction: column; padding: 16px; }
    .side-panel { width: 100%; position: static; display: flex; gap: 12px; flex-wrap: wrap; }
    .side-panel .panel-card { flex: 1; min-width: 200px; margin-bottom: 0; }
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  }
  @media (max-width: 600px) {
    .header { padding: 20px; }
    .header h1 { font-size: 1.2rem; }
    .card-grid { grid-template-columns: 1fr; }
    .side-panel .panel-card { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Day27 · 函数传参进阶 - 数组与字符串传参</h1>
    <span class="badge">共 <span id="totalCount">16</span> 张卡片</span>
  </div>
</div>

<div class="main-layout">
  <div class="content-area">
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="concept" style="--c: #FF9F43">概念/规则</button>
      <button class="filter-btn" data-filter="syntax" style="--c: #2E86DE">语法/代码</button>
      <button class="filter-btn" data-filter="error" style="--c: #EE5253">易错/坑/禁忌</button>
      <button class="filter-btn" data-filter="pointer" style="--c: #6C5CE7">指针专题</button>
      <button class="filter-btn" data-filter="application" style="--c: #10AC84">应用/实战</button>
      <button class="filter-btn" data-filter="summary" style="--c: #FDCB6E">总结/对比</button>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <aside class="side-panel" id="sidePanel">
    <div class="panel-card">
      <h3>📊 分类统计</h3>
      <div id="statsContainer"></div>
      <button class="reset-btn" id="resetBtn">🔄 重置筛选</button>
    </div>
    <div class="panel-card">
      <h3>🔑 考试等级</h3>
      <div class="stat-row"><span><span class="stat-dot" style="background:#b71c1c"></span>必考</span><span class="stat-num" id="statKey">0</span></div>
      <div class="stat-row"><span><span class="stat-dot" style="background:#d63031"></span>重点</span><span class="stat-num" id="statImportant">0</span></div>
    </div>
  </aside>
</div>

<script>
const cardsData = [
    {cat:'application',level:'必考',key:'fun_string(char *p)',name:'字符串统计-返回值方式',desc:'传入char*遍历字符串，统计字母个数同时大小写转换，用return返回个数。调用方式：sum=fun_string(s)，函数内通过*p逐字符遍历，遇\'\\0\'结束。',memo:'💡 两种回写方式：return返回值 或 指针参数回写'},
    {cat:'application',level:'必考',key:'fun_string_con(char*p,int*sum_p)',name:'字符串统计-指针回写方式',desc:'无返回值，通过int*sum_p回写统计结果。调用方式：fun_string_con(s,&sum)。函数内通过(*sum_p)++累加计数。⚠️(*sum_p)++注意加括号，否则会被解析为*(sum_p++)。',memo:'🔴 (*sum_p)++不能写成*sum_p++！++优先级高于*，会先移动指针再解引用！'},
 char *p',name:'字符串传参本质',desc:'字符数组名传参退化为char*，等价于传首元素地址&s[0]。函数内用*p或p[i]遍历，遇\'\\0\'结束。通过指针修改字符串内容会直接影响原数组。',memo:'📌 字符串传参=传char*指针，本质就是传首元素地址'},
    {cat:'syntax',level:'必考',key:'int fun_sum(int *data,int n)',name:'一维数组传参-求和',desc:'数组名a传给int*data，必须额外传n(元素个数)。sizeof(a)/sizeof(int)算长度在main中算好传入。函数内累加data[i]即可求和。',memo:'🔴 函数内sizeof(data)=8(64位指针)，算不出长度！长度必须main中算好传入'},
修改形参=修改实参，原数组直接被排序'},
    {cat:'syntax',level:'必考',key:'int *data ≡ int data[]',name:'两种形参写法等价',desc:'函数参数int *data和int data[]完全等价，编译器都当int*处理。写哪个都行。数组传参三件套：传数组名、传长度、形参用int*或int[]。',memo:'📌 口诀：数组传参三件套——传数组名、传长度、形参用int*或int[]'},
    {cat:'application',level:'重点',key:'char *del_space(char *s)',name:'双指针删除空格',desc:'快指针q遍历，慢指针p写入。非空格时*p=*q且p++q++；空格时只q++跳过。最后*p=\'\\0\'补结束符，返回s。时间O(n)空间O(1)原地修改。返回char*支持链式调用。',memo:'💡 双指针删除=快指针遍历+慢指针写入+末尾补\\0'},
    {cat:'syntax',level:'必考',key:'print_array(a[0],3,4)',name:'二维数组传参-一级指针',desc:'传a[0](第一行首元素地址)给int*a，把3×4=12个元素当一维遍历*(a+i)。二维数组内存连续行优先存储。⚠️不能直接传a给int*！a类型是int(*)[4]不匹配。必须传a[0]。',memo:'🔴 不能直接传a给int*！a类型是int(*)[4]不匹配！必须传a[0]'},
    {cat:'pointer',level:'必考',key:'int a[][M] ≡ int (*a)[M]',name:'二维数组传参-行指针',desc:'第二维M必须指定！编译器需知道每行几个元素算地址偏移。可用a[i][j]二维下标访问，最直观。实参直接传a。a[i][j]等价于*(*(a+i)+j)，先跳i行再偏移j。',memo:'📌 第二维必须指定！a[i][j] ≡ *(*(a+i)+j)，先跳行再偏移'},
    {cat:'pointer',level:'必考',key:'int *p[3]={a[0],a[1],a[2]}',name:'指针数组+二级指针传参',desc:'构造指针数组p，p退化为int**。传给int**a，函数内a[i]取第i行int*，+j偏移到第j列。*(a[i]+j)访问元素。⚠️二维数组名a不能直接传int**！类型int(*)[4]≠int**。',memo:'🔴 二维数组名a不能直接传int**！类型int(*)[4]≠int**！必须借助指针数组'},
    {cat:'error',level:'必考',key:'int** vs int(*)[4]',name:'二级指针≠行指针',desc:'int a[][4]行指针要求内存连续；int** a每行可不连续(通过指针数组间接访问)。两者类型完全不同。二维数组名a类型int(*)[4]，传int**必须借助指针数组。',memo:'🔴 行指针=内存连续+第二维固定；二级指针=每行可分散+通过指针间接访问'},
    {cat:'error',level:'必考',key:'*sum_p++',name:'运算符优先级陷阱',desc:'++优先级高于*，*sum_p++等价于*(sum_p++)先移动指针再解引用，错误！要改值应写(*sum_p)++。括号救命：(*p)++先取值再+1。',memo:'🔴 ++优先级高于*！*p++=*(p++)！要改值必须加括号写(*p)++'},
    {cat:'error',level:'必考',key:'数组传参不传n',name:'忘记传长度',desc:'函数内sizeof(data)=8(64位指针大小)，算不出元素个数。必须额外传n作为参数。sizeof只在定义数组的作用域内有效，跨函数失效。',memo:'🔴 sizeof只在定义数组的作用域内有效！跨函数必须额外传长度n'},
    {cat:'error',level:'重点',key:'int a[][]',name:'行指针忘记指定列数',desc:'int a[][]编译报错！第二维必须写：int a[][4]。第一维(行数)可省略。编译器需要第二维来计算行间地址偏移，否则无法定位a[i][j]。',memo:'🔴 int a[][]编译报错！第二维必须写！编译器靠它算行间地址偏移'},
行指针；只遍历→一级指针；动态分配→二级指针。',memo:'📌 固定列数→行指针 / 只遍历→一级指针 / 动态分配→二级指针'},
    {cat:'summary',level:'必考',key:'7大易错点',name:'Day27易错总结',desc:'①*sum_p++优先级 ②数组不传n ③a传int**类型错 ④a传int*类型错 ⑤int*vs int[]等价 ⑥a[][]缺列数 ⑦del_space忘补\\0。这7点是数组与字符串传参最常踩的坑。',memo:'📌 Day27七大易错：优先级、忘传n、类型不匹配、缺列数、忘补\\0'}
];

const catColors = {
    concept: '#FF9F43',
    syntax: '#2E86DE',
    error: '#EE5253',
    pointer: '#6C5CE7',
    application: '#10AC84',
    summary: '#FDCB6E'
};

const catNames = {
    concept: '概念/规则',
    syntax: '语法/代码',
    error: '易错/坑/禁忌',
    pointer: '指针专题',
    application: '应用/实战',
    summary: '总结/对比'
};

let currentFilter = 'all';

function renderCards() {
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    let visibleCount = 0;
    cardsData.forEach((c, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.borderLeftColor = catColors[c.cat];
        card.style.animationDelay = (i * 0.03) + 's';
        card.dataset.cat = c.cat;
        if (currentFilter !== 'all' && c.cat !== currentFilter) {
            card.classList.add('hidden');
        } else {
            visibleCount++;
        }

        const levelClass = c.level === '必考' ? 'key' : 'important';
        let memoClass = '';
        if (c.cat === 'error') memoClass = 'error-memo';
        else if (c.cat === 'pointer') memoClass = 'pointer-memo';

        card.innerHTML = `
            <div class="card-header">
                <span class="card-cat" style="color:${catColors[c.cat]}">${catNames[c.cat]}</span>
                <span class="card-level ${levelClass}">${c.level}</span>
            </div>
            <div class="card-name">${c.name}</div>
            <div class="card-key">${c.key}</div>
            <div class="card-desc">${c.desc}</div>
            <div class="card-memo ${memoClass}">${c.memo}</div>
        `;
        grid.appendChild(card);
    });
    document.getElementById('totalCount').textContent = visibleCount;
    updateStats();
    updateLevelStats();
}

function updateStats() {
    const container = document.getElementById('statsContainer');
    const counts = {};
    cardsData.forEach(c => {
        if (currentFilter === 'all' || c.cat === currentFilter) {
            counts[c.cat] = (counts[c.cat] || 0) + 1;
        }
    });
    let html = '';
    for (const [cat, name] of Object.entries(catNames)) {
        const n = counts[cat] || 0;
        html += `<div class="stat-row"><span><span class="stat-dot" style="background:${catColors[cat]}"></span>${name}</span><span class="stat-num">${n}</span></div>`;
    }
    container.innerHTML = html;
}

function updateLevelStats() {
    let keyCount = 0, impCount = 0;
    cardsData.forEach(c => {
        if (currentFilter === 'all' || c.cat === currentFilter) {
            if (c.level === '必考') keyCount++;
            else impCount++;
        }
    });
    document.getElementById('statKey').textContent = keyCount;
    document.getElementById('statImportant').textContent = impCount;
}

document.getElementById('filterBar').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderCards();
});

document.getElementById('resetBtn').addEventListener('click', () => {
    currentFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
    renderCards();
});

renderCards();
</script>

</body>
</html>
