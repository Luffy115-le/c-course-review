<script>
const QUIZ_KEY = 'wrongbank_day24';
const DAY_NUM = 24;

const allQuestions = [
  {"id":1,"type":"single","kp":"指针数组定义","text":"int *p[4]; 以下关于 p 的本质描述，正确的是？","options":["A. 一个指针，指向含4个int的数组","B. 一个数组，含4个int*类型的指针","C. 一个int变量","D. 一个二级指针"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>[]优先级高于*，所以int *p[4]先和[]结合，是数组。数组有4个元素，每个元素是int*类型的指针。所以p是一个<strong>指针数组</strong>。"},
 <strong>数组指针</strong><br>• int *p[4]：[]优先级高，先结合数组 → 指针数组<br>• int **p：二级指针<br>• int p[4]：普通int数组"},
  {"id":3,"type":"single","kp":"指针数组初始化","text":"int a=10, b=20; int *p[2] = {&a, &b}; 则 *p[0] 的值是？","options":["A. 20","B. 10","C. a的地址","D. p的地址"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>p是指针数组，p[0]存储的是a的地址&a。*p[0]就是对p[0]解引用，得到a的值10。运算顺序：先[]取p[0]，再*解引用。"},
  {"id":4,"type":"single","kp":"修改字符串常量","text":"char *p = \"hello\"; 以下哪项操作是正确且安全的？","options":["A. p[0] = 'H';","B. *p = 'H';","C. char s[] = \"hello\"; s[0] = 'H';","D. *(p+0) = 'H';"],"correct":"C","correctText":"C","expl":"<strong>解析：</strong>A、B、D都是尝试修改字符串常量（只读内存），会导致段错误。C选项将字符串复制到栈上的字符数组s中，可以安全修改s[0]='H'。"},
  {"id":5,"type":"single","kp":"二级指针","text":"int a=10; int *p=&a; int **pp=&p; 要通过 pp 取出 a 的值，正确写法是？","options":["A. *pp","B. pp","C. **pp","D. &pp"],"correct":"C","correctText":"C","expl":"<strong>解析：</strong>链式解引用：<br>• pp = &p（p的地址）<br>• *pp = p（即&a，a的地址）<br>• **pp = *p = a（a的值10）<br>所以取a的值需要两次解引用：**pp"},
  {"id":6,"type":"single","kp":"命令行参数","text":"执行命令 ./calc 10 + 5，则 argc 和 argv[2] 的值分别是？","options":["A. argc=3, argv[2]=\"10\"","B. argc=4, argv[2]=\"+\"","C. argc=4, argv[2]=\"10\"","D. argc=3, argv[2]=\"+\""],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>命令行参数以空格分隔：<br>• argv[0] = \"./calc\"（程序名）<br>• argv[1] = \"10\"<br>• argv[2] = \"+\"<br>• argv[3] = \"5\"<br>共4个参数，argc=4"},
  {"id":7,"type":"single","kp":"指针数组传参","text":"将指针数组 char *names[] 传给函数后，形参退化为？","options":["A. 一级指针 char*","B. 二级指针 char**","C. 数组指针 char(*)[ ]","D. 不退化，仍是原数组"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>数组传参时退化为指向首元素的指针。指针数组的元素是char*，所以指向首元素（char*）的指针就是 char**（二级指针）。在函数内无法用sizeof求原数组大小。"},
  {"id":8,"type":"single","kp":"冒泡排序字符串","text":"对 char *names[] 进行冒泡排序时，要交换两个字符串的位置，应该交换什么？","options":["A. 交换字符串内容（逐个字符拷贝）","B. 交换两个 char* 指针的值","C. 交换数组名","D. 交换字符串的长度"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>指针数组存的是各字符串的地址（char*指针）。排序时只需交换两个指针变量的值（地址），就能改变字符串的顺序，效率很高。不需要逐个拷贝字符串内容。"},
  {"id":9,"type":"single","kp":"指针数组sizeof","text":"64位系统下：int *p[4]; 则 sizeof(p) 的值是？","options":["A. 4","B. 8","C. 16","D. 32"],"correct":"D","correctText":"D","expl":"<strong>解析：</strong>p是指针数组，含4个int*元素。64位下每个指针占8字节。所以 sizeof(p) = 4 × 8 = 32 字节。注意：传参后退化为二级指针，sizeof只会得到8。"},
  {"id":10,"type":"single","kp":"二维字符数组vs指针数组","text":"char *books[] = {\"C语言\",\"Java\"}; 和 char books[2][10] = {\"C语言\",\"Java\"}; 的区别，正确的是？","options":["A. 两者完全等价","B. 前者省空间、可交换指针但不可改内容；后者栈上可改但占空间大","C. 前者在栈上可改内容；后者指向只读区","D. 前者sizeof更大"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>• char* books[]：指针数组，存的是指向只读区字符串的指针（各指针8字节），省空间、可交换指针、但内容不可改<br>• char books[2][10]：二维数组，在栈上开了2×10=20字节空间，复制了内容，可修改但占空间大"},
  {"id":11,"type":"judge","kp":"修改字符串常量","text":"char *p = \"hello\"; 可以通过 p[0] = 'H' 将首字母改为大写。","options":["A. 正确","B. 错误"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>错误。char *p=\"hello\"使p指向只读内存中的字符串常量。p[0]='H'等价于*p='H'，尝试修改只读内存，会触发<strong>段错误（Segmentation Fault）</strong>。"},
  {"id":12,"type":"judge","kp":"二级指针","text":"int a=10; int *p=&a; int **pp=&p; 则 **pp 的值就是 a 的值。","options":["A. 正确","B. 错误"],"correct":"A","correctText":"A","expl":"<strong>解析：</strong>正确。二级指针链式解引用：<br>• pp 存储 p 的地址<br>• *pp 得到 p 的值（即&a，a的地址）<br>• **pp 对*pp再解引用，得到 *(&a) = a = 10"},
  {"id":13,"type":"judge","kp":"命令行参数","text":"main(int argc,char*argv[]) 中，argv[0] 是用户输入的第一个参数。","options":["A. 正确","B. 错误"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>错误。argv[0]始终是<strong>程序名</strong>（如./a.out或./calc），用户输入的第一个参数是 argv[1]，第二个是argv[2]，以此类推。"},
  {"id":14,"type":"judge","kp":"指针数组传参","text":"将指针数组传入函数后，在函数内部用 sizeof(形参) / sizeof(形参[0]) 可以计算出原数组的元素个数。","options":["A. 正确","B. 错误"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>错误。数组传参后退化为指针（指针数组退化为二级指针char**），sizeof(形参)只能得到指针大小（8字节），无法得到原数组总大小。必须额外传元素个数n。"}
];

const codingQuestions = [
  {"id":101,"type":"coding","kp":"指针数组初始化","difficulty":"入门","title":"指针数组打印字符串","desc":"定义指针数组 char *names[] = {\"张三\",\"李四\",\"王五\",\"赵六\", NULL}; 使用 while 循环通过 NULL 哨兵值遍历，打印每个名字。","hint":"用 char **p = names; while(*p != NULL) { printf(\"%s\\n\", *p); p++; } 遍历。NULL作为哨兵，标记数组结束。","answer":"#include <stdio.h>\n\nint main() {\n    char *names[] = {\"张三\", \"李四\", \"王五\", \"赵六\", NULL};\n    char **p = names;\n\n    while (*p != NULL) {\n        printf(\"%s\\n\", *p);\n        p++;\n    }\n\n    return 0;\n}","test_input":"","expected_output":"张三\n李四\n王五\n赵六"},
  {"id":102,"type":"coding","kp":"二级指针","difficulty":"入门","title":"二级指针验证","desc":"定义 int a=100, b=200; int *p1=&a, *p2=&b; int **pp1=&p1, **pp2=&p2;\n依次打印 **pp1, **pp2, *p1, *p2 的值；然后通过 **pp1=300 修改a的值，最后再打印 a 的值验证。","hint":"**pp1就是a的值。pp1存p1的地址，*pp1得到&a，**pp1就是*(&a)=a。用**pp1=300可以修改a。","answer":"#include <stdio.h>\n\nint main() {\n    int a = 100, b = 200;\n    int *p1 = &a, *p2 = &b;\n    int **pp1 = &p1, **pp2 = &p2;\n\n    printf(\"**pp1 = %d\\n\", **pp1);\n    printf(\"**pp2 = %d\\n\", **pp2);\n    printf(\"*p1 = %d\\n\", *p1);\n    printf(\"*p2 = %d\\n\", *p2);\n\n    **pp1 = 300;\n    printf(\"修改后 a = %d\\n\", a);\n\n    return 0;\n}","test_input":"","expected_output":"**pp1 = 100\n**pp2 = 200\n*p1 = 100\n*p2 = 200\n修改后 a = 300"},

function getWrongBank(){
  try{return JSON.parse(localStorage.getItem(QUIZ_KEY)||'[]')}catch(e){return []}
}
function saveWrongBank(list){
  localStorage.setItem(QUIZ_KEY, JSON.stringify(list));
}
function addToWrongBank(q, userAns){
  const bank = getWrongBank();
  if(!bank.find(function(x){return x.id===q.id})){
    bank.push({
      id:q.id,type:q.type,kp:q.kp,text:q.text,
      options:q.options,correct:q.correct,correctText:q.correctText,
      expl:q.expl,userAns:userAns,time:Date.now()
    });
    saveWrongBank(bank);
  }
}
function saveProgress(){
  if(currentMode==='review') return;
  const prog = {
    mode:currentMode, index:currentQIndex, answers:answers,
    ids:currentQuestions.map(function(q){return q.id}), time:Date.now()
  };
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(prog));
}
function loadProgress(){
  try{return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null')}catch(e){return null}
}
function clearProgress(){
  localStorage.removeItem(PROGRESS_KEY);
}
function shuffle(arr){
  const a=[];
  for(let i=0;i<arr.length;i++) a.push(arr[i]);
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function startQuiz(mode){
  clearProgress();
  currentMode = mode;
  currentQIndex = 0;
  answers = {};
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('reviewArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
  const tabMap = {normal:0, coding:1, wrongredo:2, review:3};
  if(tabMap[mode]!==undefined) document.querySelectorAll('.mode-tab')[tabMap[mode]].classList.add('active');

  if(mode==='coding'){
    currentQuestions = [];
    for(let i=0;i<codingQuestions.length;i++) currentQuestions.push(codingQuestions[i]);
  } else if(mode==='wrongredo'){
    const bank = getWrongBank();
    if(bank.length===0){
      alert('错题库为空，没有错题可以重做！');
      switchMode('normal');
      return;
    }
    currentQuestions = bank.map(function(w){return Object.assign({},w,{isWrongRedo:true})});
  } else if(mode==='consolidate'){
    const bank = getWrongBank();
    if(bank.length===0){
      alert('错题库为空，先去做题吧！');
      switchMode('normal');
      return;
    }
    const weakKps = [];
    const seen={};
    for(let i=0;i<bank.length;i++){if(!seen[bank[i].kp]){weakKps.push(bank[i].kp);seen[bank[i].kp]=true;}}
    let pool = allQuestions.filter(function(q){return weakKps.indexOf(q.kp)>=0 && !bank.find(function(w){return w.id===q.id})});
    if(pool.length<5) pool = allQuestions.filter(function(q){return !bank.find(function(w){return w.id===q.id})});
    currentQuestions = shuffle(pool).slice(0, Math.min(10, pool.length));
  } else {
    currentQuestions = [];
    for(let i=0;i<allQuestions.length;i++) currentQuestions.push(allQuestions[i]);
  }

  if(currentQuestions.length===0){
    alert('没有题目！');
    return;
  }
  renderQuestion();
}

function switchMode(mode){
  if(mode==='review'){
    document.getElementById('quizArea').style.display='none';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('reviewArea').style.display='block';
    document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.mode-tab')[3].classList.add('active');
    currentMode='review';
    renderReview();
    return;
  }
  startQuiz(mode);
}

function selectOption(label, e){
  const q = currentQuestions[currentQIndex];
  answers[q.id] = label;
  document.querySelectorAll('.option').forEach(function(o){o.classList.remove('selected')});
  e.currentTarget.classList.add('selected');
}

function showHint(){
  document.getElementById('hintBox').classList.toggle('show');
}
function showAnswerCoding(){
  document.getElementById('answerDisplay').classList.toggle('show');
}

function submitQ(e){
  const q = currentQuestions[currentQIndex];
  let userAns = answers[q.id];
  let isCorrect = false;

  if(q.type==='fill'){
    const inputs = document.querySelectorAll('.fill-blank');
    userAns = Array.from(inputs).map(function(i){return i.value.trim()});
    isCorrect = q.correct.every(function(c,i){return userAns[i] && userAns[i].toLowerCase()===c.toLowerCase()});
    if(!isCorrect) addToWrongBank(q, userAns.join(' | '));
  } else {
    if(!userAns){
      alert('请先选择一个答案！');
      return;
    }
    isCorrect = userAns===q.correct;
    if(!isCorrect) addToWrongBank(q, userAns||'未作答');
  }

  if(q.type==='single' || q.type==='judge'){
    document.querySelectorAll('.option').forEach(function(o,i){
      const labels = q.type==='judge'?['A','B']:['A','B','C','D'];
      if(labels[i]===q.correct) o.classList.add('correct');
      else if(labels[i]===userAns) o.classList.add('wrong');
      o.style.pointerEvents='none';
    });
  } else if(q.type==='fill'){
    document.querySelectorAll('.fill-blank').forEach(function(inp,i){
      inp.disabled = true;
      if(inp.value.trim().toLowerCase()===q.correct[i].toLowerCase()){
        inp.style.background='#d4edda';inp.style.borderColor='#27ae60';
      } else {
        inp.style.background='#f8d7da';inp.style.borderColor='#e74c3c';
        inp.title = '正确答案: '+q.correct[i];
      }
    });
  }

  document.getElementById('expl').classList.add('show');
  const nb = document.getElementById('nextBtn');
  const fb = document.getElementById('finishBtn');
  if(nb) nb.removeAttribute('style');
  if(fb) fb.removeAttribute('style');
  e.currentTarget.style.display='none';
  saveProgress();
}

function prevQ(){
  if(currentQIndex>0){currentQIndex--;renderQuestion()}
}
function nextQ(){
  if(currentQIndex<currentQuestions.length-1){currentQIndex++;renderQuestion()}
  else finishQuiz();
}

function finishQuiz(){
  saveProgress();
  let correct=0, wrongList=[];
  currentQuestions.forEach(function(q){
    if(q.type==='coding') return;
    const ua = answers[q.id];
    let ok=false;
    if(q.type==='fill'){
      const ual = (ua||[]);
      ok = Array.isArray(ual) && q.correct.every(function(c,i){return ual[i] && ual[i].toLowerCase()===c.toLowerCase()});
    } else { ok = ua===q.correct; }
    if(ok) correct++; else wrongList.push({q:q,userAns:Array.isArray(ua)?ua.join(' | '):(ua||'未作答')});
  });

  const total = currentQuestions.filter(function(q){return q.type!=='coding'}).length;
  const wrong = total - correct;
  const score = total>0 ? Math.round(correct/total*100) : 0;

  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('score').textContent = score;
  document.getElementById('score').style.color = score>=90?'#27ae60':score>=60?'#f39c12':'#e74c3c';
  document.getElementById('message').textContent = score>=90?'🎉 太棒了！掌握得很好！':score>=60?'👍 继续努力，还有提升空间！':'💪 基础还需加强，多复习知识点！';
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('totalCount').textContent = total;

  if(wrongList.length>0){
    document.getElementById('wrongBankPreview').style.display='block';
    let html='';
    wrongList.forEach(function(w){
      html += '<div class="wrong-item"><div class="wq">'+w.q.kp+': '+w.q.text.substring(0,50)+'...</div><div class="wa">你的答案: '+w.userAns+'</div><div class="wc">正确答案: '+(w.q.correctText||w.q.correct)+'</div></div>';
    });
    document.getElementById('wrongPreviewList').innerHTML = html;
  } else {
    document.getElementById('wrongBankPreview').style.display='none';
  }
  clearProgress();
}

function removeWrong(id){
  if(!confirm('确定删除这道错题吗？')) return;
  const bank = getWrongBank().filter(function(w){return w.id!==id});
  saveWrongBank(bank);
  renderReview();
}

function clearWrongBank(){
  if(!confirm('确定清空所有错题吗？此操作不可恢复！')) return;
  saveWrongBank([]);
  renderReview();
}

    const kp=entry[0],count=entry[1];
    const info = kpMap[kp] || {title:kp, content:'暂无详细说明，请看教材。'};
    const related = bank.filter(function(w){return w.kp===kp});
    html += '<div class="kp-section">';
    html += '<div class="kp-header"><div class="kp-title">'+info.title+'</div><span class="kp-badge">错 '+count+' 次</span></div>';
    html += '<div class="kp-content">'+info.content+'</div>';
    html += '<div class="kp-wrong-list">相关错题：<br>';
    related.forEach(function(r){
      html += '• '+r.text.substring(0,60)+(r.text.length>60?'...':'')+'<br>';
    });
    html += '</div></div>';
  });
  el.innerHTML = html;
}

window.addEventListener('beforeunload', saveProgress);

(function(){
  const p = loadProgress();
  if(p && p.mode && p.ids && p.ids.length>0 && Date.now()-p.time < 3600000){
    if(confirm('检测到上次未完成的答题进度，是否恢复？')){
      currentMode = p.mode;
      currentQIndex = p.index;
      answers = p.answers || {};
      let pool;
      if(p.mode==='coding') pool = codingQuestions;
      else pool = allQuestions;
      currentQuestions = p.ids.map(function(id){return pool.find(function(q){return q.id===id})}).filter(Boolean);
      if(currentQuestions.length>0){
        document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
        const tm = {normal:0,coding:1,wrongredo:2};
        if(tm[p.mode]!==undefined) document.querySelectorAll('.mode-tab')[tm[p.mode]].classList.add('active');
        renderQuestion();
        return;
      }
    }
    clearProgress();
  }
  startQuiz('normal');
})();
</script>
</body>
</html>
