const allQuestions = [
  {"id":1,"type":"single","kp":"指针函数定义","text":"什么是指针函数？","options":["A. 指向函数的指针变量","B. 返回值为指针的函数","C. 参数为指针的函数","D. 调用其他函数的函数"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>• <strong>B正确</strong>：指针函数本质是一个<strong>函数</strong>，只是它的返回值类型是指针：<code>类型 * 函数名(参数)</code><br>• 例：<code>char * get_string()</code> 返回 char*，是指针函数<br>• A：那是\"函数指针\"，是指向函数的指针变量，完全不同的概念<br>• C：参数是指针只是普通函数，不算指针函数<br>• D：和指针返回无关<br>📌 关键看<strong>返回类型</strong>是否带 *，而不是参数！"},
  {"id":2,"type":"single","kp":"指针函数vs函数指针","text":"char *f() 和 char (*f)() 的区别是？","options":["A. 前者是指针函数，后者是函数指针","B. 前者是函数指针，后者是指针函数","C. 两者都是指针函数","D. 两者都是函数指针"],"correct":"A","correctText":"A","expl":"<strong>解析：</strong>• <strong>A正确</strong>：<br>• <code>char *f()</code>：* 跟返回类型走，是个<strong>返回 char* 的函数</strong>（指针函数）<br>• <code>char (*f)()</code>：括号让 * 跟 f 走，f 是个<strong>指向返回char的函数的指针</strong>（函数指针）<br>🔴 区分口诀：看 <code>*</code> 是修饰\"返回类型\"还是\"函数名\"！<br>• <code>类型 * 名()</code> = 指针函数（返回指针）<br>• <code>类型 (*名)()</code> = 函数指针（指向函数）"},
 野指针！<br>• B：局部int变量同理，返回其地址也是野指针<br>📌 安全返回三类：① 字符串常量 ② static局部变量 ③ 全局/堆内存"},
 野指针 🔴<br>• A：字符串常量在静态区，安全<br>• B：static 把 s 放到全局数据区，函数返回后仍存在，安全<br>• C：s 指向字符串常量，返回的是常量地址，安全<br>📌 栈区局部变量绝不能返回其地址！"},
  {"id":5,"type":"single","kp":"strcpy链式调用","text":"strcpy(s1, strcpy(s2, s3)) 能够链式调用的原因是？","options":["A. strcpy 返回 void","B. strcpy 返回 char*（目标首地址）","C. strcpy 不返回值","D. strcpy 返回 src 的地址"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>• <strong>B正确</strong>：strcpy 的函数原型是 <code>char * strcpy(char *dest, const char *src)</code>，<strong>返回 dest 的首地址</strong><br>• 内层 <code>strcpy(s2, s3)</code> 把 s3 拷给 s2 后返回 s2 的地址<br>• 外层 <code>strcpy(s1, ...)</code> 用返回的 s2 地址作 src，再把 s2 拷给 s1<br>• 最终 s1、s2、s3 内容都是 s3 的值<br>📌 链式调用的前提：函数<strong>返回类型和参数类型匹配</strong>！strcpy 因为返回 char*，正好可以当下一个 strcpy 的 char* 参数。"},
  {"id":6,"type":"single","kp":"while(*dest++=*src++)K&R写法","text":"while(*dest++ = *src++) 的执行顺序是？","options":["A. 先判断，再赋值，最后自增","B. 先自增，再赋值，最后判断","C. 先赋值，再判断赋值结果，最后两个指针自增","D. 先赋值，再自增，最后判断"],"correct":"C","correctText":"C","expl":"<strong>解析：</strong>• <strong>C正确</strong>：这是 K&R 经典写法，分三步：<br>① <strong>赋值</strong>：<code>*dest = *src</code> 把 src 指向的字符赋给 dest 指向的位置<br>② <strong>判断</strong>：赋值表达式的值就是刚赋的字符，while 判断它是否为 '\\0'（非0继续，0结束）<br>③ <strong>自增</strong>：dest++ 和 src++ 让两个指针后移一位（后置++，先赋值再自增）<br>🔴 关键：<strong>后置++ 先用值再自增</strong>，所以 '\\0' 也会被拷贝过去！循环结束后 dest 已指向 '\\0' 之后。"},
  {"id":7,"type":"single","kp":"my_strcpy保存首地址","text":"my_strcpy 中为什么要 char *s = dest 保存首地址？","options":["A. 为了避免内存泄漏","B. 为了让 dest 不被修改","C. 为了让 dest 指向 '\\0'","D. 因为 dest 后面会移动，需要返回原始首地址"],"correct":"D","correctText":"D","expl":"<strong>解析：</strong>• <strong>D正确</strong>：在 <code>while(*dest++ = *src++)</code> 中，dest 会一直往后移动，循环结束时 dest 已经指向字符串末尾之后的位置<br>• 如果直接 <code>return dest</code>，返回的是末尾之后的地址，<strong>不是字符串开头</strong>，链式调用会出错！<br>• 所以函数一开始就要 <code>char *s = dest</code> 保存首地址，最后 <code>return s</code> 返回的是字符串开头 ✅<br>📌 这是 strcpy 实现的核心技巧：移动指针前先存首地址！"},
  {"id":8,"type":"single","kp":"my_strcat找末尾dest--","text":"my_strcat 中 while(*dest++); dest--; 的作用是？","options":["A. 找到 dest 字符串末尾 '\\0' 位置","B. 复制 src 到 dest","C. 删除 dest 的内容","D. 计算 src 的长度"],"correct":"A","correctText":"A","expl":"<strong>解析：</strong>• <strong>A正确</strong>：strcat 第一步必须先找到 dest 字符串的<strong>末尾 '\\0'</strong>在哪里，从那里开始追加 src<br>• <code>while(*dest++)</code>：循环到 *dest 为 '\\0' 时停止，但因为是<strong>后置++</strong>，dest 已经多走了一步，指向 '\\0' 之后<br>• <code>dest--</code>：回退一步，让 dest 重新指向 '\\0' 的位置，方便接下来的 <code>while(*dest++=*src++)</code> 从这里开始覆盖追加<br>🔴 不 dest-- 的话会在末尾 '\\0' 之后留一个空字符，导致追加后字符串中间出现 '\\0' 截断！"},
45→4→0）<br>• 因为是从低位往高位取，得到的字符串是<strong>倒序</strong>的（如 \"654\"），所以最后还要用双指针交换反转成 \"456\"<br>📌 数字转字符公式：<code>digit + '0'</code>（48 就是 '0'）"},
  {"id":10,"type":"single","kp":"static局部变量安全返回","text":"static char s[20] 为什么能安全返回？","options":["A. static 让变量变成常量","B. static 让变量存在寄存器中","C. static 将变量从栈区移到全局数据区，生命周期延长","D. static 让变量存在堆区"],"correct":"C","correctText":"C","expl":"<strong>解析：</strong>• <strong>C正确</strong>：普通局部变量在<strong>栈区</strong>，函数返回时栈帧销毁，地址失效<br>• 加 <code>static</code> 后变量被存放到<strong>全局数据区</strong>（数据段），生命周期延长到整个程序结束，函数返回后内存依然有效 ✅<br>• 副作用：多次调用同一函数，static 变量会<strong>保留上次的值</strong>（不会重新初始化），这点要注意<br>• 例：<code>char * mystring() { static char s[20]; strcpy(s,\"hello\"); return s; }</code> 安全<br>📌 static 三大作用：① 延长生命周期 ② 限制作用域（文件级）③ 默认初始化为0"},
  {"id":11,"type":"judge","kp":"指针函数vs函数指针","text":"指针函数和函数指针是同一个概念。","options":["A. 正确","B. 错误"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>错误！两者<strong>完全不同</strong>：<br>• <strong>指针函数</strong>：本质是<strong>函数</strong>，返回值是指针。声明 <code>char *f()</code>，f 是函数名<br>• <strong>函数指针</strong>：本质是<strong>指针变量</strong>，指向一个函数。声明 <code>char (*f)()</code>，f 是指针变量<br>🔴 区分口诀：看 * 是修饰返回类型还是函数名（用括号区分）<br>• <code>类型 *名()</code>：指针函数（返回指针）<br>• <code>类型 (*名)()</code>：函数指针（指向函数）"},
  {"id":12,"type":"judge","kp":"返回局部数组(野指针)","text":"返回局部非 static 数组的地址会导致野指针。","options":["A. 正确","B. 错误"],"correct":"A","correctText":"A","expl":"<strong>解析：</strong>正确！经典坑：<br>• <code>char * f() { char ch[10]=\"hi\"; return ch; }</code><br>• ch 是局部数组，存在<strong>栈区</strong>，函数返回时栈帧销毁，ch 的内存被回收<br>• 返回的地址指向\"已释放的栈内存\"，再访问就是<strong>野指针</strong>，可能读到垃圾数据甚至崩溃 🔴<br>✅ 解决方案三选一：<br>① 返回字符串常量 <code>return \"hello\";</code><br>② 加 static <code>static char ch[10]</code><br>③ 由调用者传入缓冲区 <code>char * f(char *buf)</code>"},
 '\\0' 已经被拷贝过去了 ✅<br>• 所以这种写法<strong>不需要</strong>循环外再手动 <code>*dest = '\\0'</code>，它已经自动处理了字符串结束符<br>📌 相比之下，my_strcpy 第一版用 <code>while(*src != '\\0')</code> 判断，循环后必须手动 <code>*dest = *src</code> 补一个 '\\0'"},

  {"id":102,"type":"coding","kp":"while(*dest++=*src++)K&R写法","difficulty":"入门","title":"自己实现my_strcpy","desc":"实现 char * my_strcpy(char *dest, const char *src)，用 while(*dest++ = *src++) 方式拷贝字符串。\n在 main 中：char s1[100]; char *s2 = \"welcome\"; my_strcpy(s1, s2); puts(s1); 输出 welcome\n\n提示：保存首地址 char *s = dest; while(*dest++ = *src++); return s;","hint":"关键三步：\n① 函数开头 char *s = dest; 保存首地址\n② while(*dest++ = *src++); 一行搞定拷贝（含'\\0'自动拷贝）\n③ return s; 返回首地址（dest已移动到末尾，不能return dest）\nmain: char s1[100]; char *s2=\"welcome\"; puts(my_strcpy(s1,s2));","answer":"#include <stdio.h>\n\nchar * my_strcpy(char *dest, const char *src) {\n    char *s = dest;\n    while (*dest++ = *src++);\n    return s;\n}\n\nint main() {\n    char s1[100];\n    char *s2 = \"welcome\";\n    my_strcpy(s1, s2);\n    puts(s1);\n    return 0;\n}","test_input":"","expected_output":"welcome"},

 * 跟返回类型走，f 是函数，返回 char*<br>• <strong>函数指针</strong>：<code>char (*f)()</code> → * 跟 f 走（括号改变优先级），f 是指向函数的指针变量<br>🔴 区分口诀：<br>• <code>类型 *名()</code> = 指针函数（返回指针）<br>• <code>类型 (*名)()</code> = 函数指针（指向函数）<br>📌 函数指针常用于回调、qsort 自定义比较函数；指针函数常用于字符串/数组返回"},
  "返回局部数组(野指针)":{"title":"返回局部数组 = 野指针（必坑！）","content":"<strong>经典坑！</strong>返回局部非 static 数组的地址是<strong>野指针</strong>：<br><code>char * f() { char ch[10]=\"hi\"; return ch; }</code> 🔴<br>• ch 在<strong>栈区</strong>，函数返回时栈帧销毁，ch 内存被回收<br>• 返回的地址指向\"已释放内存\"，访问得到垃圾数据甚至崩溃<br>✅ 三种安全替代方案：<br>① 返回字符串常量 <code>return \"hello\";</code><br>② 加 static <code>static char ch[10]</code><br>③ 由调用者传入缓冲区 <code>char * f(char *buf)</code>"},
  "返回字符串常量(安全)":{"title":"返回字符串常量（安全）","content":"字符串常量存放在<strong>静态存储区</strong>（只读段），生命周期 = 整个程序：<br><code>char * get_string() { return \"hello world\"; }</code> ✅<br>• 即使函数返回，常量内存依然存在，调用者可以安全读取<br>• 等价写法：<code>char *s = \"hello\"; return s;</code>（s 是局部指针变量，但它存的地址指向常量区，返回的是地址本身）<br>🔴 注意：字符串常量是<strong>只读</strong>的，调用者拿到地址后不能修改！尝试 <code>p[0]='H'</code> 会段错误<br>📌 适合返回固定不变的字符串"},
  "static局部变量安全返回":{"title":"static 局部变量安全返回","content":"加 <code>static</code> 把局部变量从<strong>栈区</strong>搬到<strong>全局数据区</strong>，生命周期延长到程序结束：<br><code>char * mystring() { static char s[20]; strcpy(s, \"hello\"); return s; }</code> ✅<br>• 函数返回后 s 内存依然有效，调用者可安全访问<br>• static 三大作用：① 延长生命周期 ② 限制作用域（文件级）③ 默认初始化为0<br>🔴 副作用：每次调用函数，static 变量<strong>不重新初始化</strong>，会保留上次值！多次调用返回的是同一块内存<br>📌 适合返回可修改的、需要跨调用保留内容的字符串缓冲区"},

function shuffle(arr){
  const a=[];
  for(let i=0;i<arr.length;i++) a.push(arr[i]);
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

  answers = {};

  document.getElementById('reviewArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
  const tabMap = {normal:0, coding:1, wrongredo:2, review:3};
  if(tabMap[mode]!==undefined) document.querySelectorAll('.mode-tab')[tabMap[mode]].classList.add('active');

  if(mode==='coding'){
    currentQuestions = [];
    for(let i=0;i<codingQuestions.length;i++) currentQuestions.push(codingQuestions[i]);
  } else if(mode==='wrongredo'){
    const bank = getWrongBank();
    if(bank.length===0){
      alert('错题库为空，没有错题可以重做！');
      switchMode('normal');
      return;
    }
    currentQuestions = bank.map(function(w){return Object.assign({},w,{isWrongRedo:true})});
  } else if(mode==='consolidate'){
    const bank = getWrongBank();
    if(bank.length===0){
      alert('错题库为空，先去做题吧！');
      switchMode('normal');
      return;
    }
    const weakKps = [];
    const seen={};
    for(let i=0;i<bank.length;i++){if(!seen[bank[i].kp]){weakKps.push(bank[i].kp);seen[bank[i].kp]=true;}}
    let pool = allQuestions.filter(function(q){return weakKps.indexOf(q.kp)>=0 && !bank.find(function(w){return w.id===q.id})});
    if(pool.length<5) pool = allQuestions.filter(function(q){return !bank.find(function(w){return w.id===q.id})});
    currentQuestions = shuffle(pool).slice(0, Math.min(10, pool.length));
  } else {
    currentQuestions = [];
    for(let i=0;i<allQuestions.length;i++) currentQuestions.push(allQuestions[i]);
  }

  if(currentQuestions.length===0){
    alert('没有题目！');
    return;
  }
  renderQuestion();
}

  let isCorrect = false;

  if(q.type==='fill'){
    const inputs = document.querySelectorAll('.fill-blank');
    userAns = Array.from(inputs).map(function(i){return i.value.trim()});
    isCorrect = q.correct.every(function(c,i){return userAns[i] && userAns[i].toLowerCase()===c.toLowerCase()});
    if(!isCorrect) addToWrongBank(q, userAns.join(' | '));
  } else {
    if(!userAns){
      alert('请先选择一个答案！');
      return;
    }
    isCorrect = userAns===q.correct;
    if(!isCorrect) addToWrongBank(q, userAns||'未作答');
  }

  if(q.type==='single' || q.type==='judge'){
    document.querySelectorAll('.option').forEach(function(o,i){
      const labels = q.type==='judge'?['A','B']:['A','B','C','D'];
      if(labels[i]===q.correct) o.classList.add('correct');
      else if(labels[i]===userAns) o.classList.add('wrong');
      o.style.pointerEvents='none';
    });
  } else if(q.type==='fill'){
    document.querySelectorAll('.fill-blank').forEach(function(inp,i){
      inp.disabled = true;
      if(inp.value.trim().toLowerCase()===q.correct[i].toLowerCase()){
        inp.style.background='#d4edda';inp.style.borderColor='#27ae60';
      } else {
        inp.style.background='#f8d7da';inp.style.borderColor='#e74c3c';
        inp.title = '正确答案: '+q.correct[i];
      }
    });
  }

  document.getElementById('expl').classList.add('show');
  const nb = document.getElementById('nextBtn');
  const fb = document.getElementById('finishBtn');
  if(nb) nb.removeAttribute('style');
  if(fb) fb.removeAttribute('style');
  e.currentTarget.style.display='none';
  saveProgress();
}

function prevQ(){
  if(currentQIndex>0){currentQIndex--;renderQuestion()}
}
function nextQ(){
  if(currentQIndex<currentQuestions.length-1){currentQIndex++;renderQuestion()}
  else finishQuiz();
}

function finishQuiz(){
  saveProgress();
  let correct=0, wrongList=[];
  currentQuestions.forEach(function(q){
    if(q.type==='coding') return;
    const ua = answers[q.id];
    let ok=false;
    if(q.type==='fill'){
      const ual = (ua||[]);
      ok = Array.isArray(ual) && q.correct.every(function(c,i){return ual[i] && ual[i].toLowerCase()===c.toLowerCase()});
    } else { ok = ua===q.correct; }
    if(ok) correct++; else wrongList.push({q:q,userAns:Array.isArray(ua)?ua.join(' | '):(ua||'未作答')});
  });

  const total = currentQuestions.filter(function(q){return q.type!=='coding'}).length;
  const wrong = total - correct;
  const score = total>0 ? Math.round(correct/total*100) : 0;

  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('score').textContent = score;
  document.getElementById('score').style.color = score>=90?'#27ae60':score>=60?'#f39c12':'#e74c3c';
  document.getElementById('message').textContent = score>=90?'🎉 太棒了！掌握得很好！':score>=60?'👍 继续努力，还有提升空间！':'💪 基础还需加强，多复习知识点！';
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('totalCount').textContent = total;

  if(wrongList.length>0){
    document.getElementById('wrongBankPreview').style.display='block';
    let html='';
    wrongList.forEach(function(w){
      html += '<div class="wrong-item"><div class="wq">'+w.q.kp+': '+w.q.text.substring(0,50)+'...</div><div class="wa">你的答案: '+w.userAns+'</div><div class="wc">正确答案: '+(w.q.correctText||w.q.correct)+'</div></div>';
    });
    document.getElementById('wrongPreviewList').innerHTML = html;
  } else {
    document.getElementById('wrongBankPreview').style.display='none';
  }
  clearProgress();
}

function renderReview(){
  const bank = getWrongBank();
  document.getElementById('wrongBankCount').textContent = bank.length;
  switchReviewTab('list');
}

function switchReviewTab(tab){
  document.querySelectorAll('.review-tab').forEach(function(t){t.classList.remove('active')});
  if(event&&event.target) event.target.classList.add('active');
  else document.querySelectorAll('.review-tab')[tab==='list'?0:1].classList.add('active');
  document.getElementById('wrongBankList').style.display = tab==='list'?'block':'none';
  document.getElementById('knowledgeReview').style.display = tab==='knowledge'?'block':'none';
  if(tab==='list') renderWrongList();
  else renderKnowledgeReview();
}

function renderWrongList(){
  const bank = getWrongBank();
  const el = document.getElementById('wrongBankList');
  if(bank.length===0){el.innerHTML='<div class="empty-state">暂无错题，继续加油！</div>';return}
  let html='';
  bank.sort(function(a,b){return b.time-a.time}).forEach(function(w,i){
    html += '<div class="kp-section" style="border-left-color:#e74c3c">';
    html += '<div class="kp-header"><div class="kp-title">'+(i+1)+'. '+w.kp+'</div>';
    html += '<button class="btn" style="background:#e74c3c;color:white;padding:3px 10px;font-size:11px" onclick="removeWrong('+w.id+')">删除</button></div>';
    html += '<div class="kp-content">'+w.text+'</div>';
    if(w.options){
      html += '<div class="options" style="margin-top:8px">';
      const labels = w.type==='judge'?['A','B']:['A','B','C','D'];
      w.options.forEach(function(opt,j){
        const cls = labels[j]===w.correct?'correct':(labels[j]===w.userAns?'wrong':'');
        html += '<div class="option '+cls+'" style="cursor:default;pointer-events:none"><span class="option-label">'+labels[j]+'.</span>'+opt+'</div>';
      });
      html += '</div>';
    }
    html += '<div class="explanation show"><div class="explanation-title">📖 解析</div>'+(w.expl||'')+'</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function removeWrong(id){
  if(!confirm('确定删除这道错题吗？')) return;
  const bank = getWrongBank().filter(function(w){return w.id!==id});
  saveWrongBank(bank);
  renderReview();
}

function clearWrongBank(){
  if(!confirm('确定清空所有错题吗？此操作不可恢复！')) return;
  saveWrongBank([]);
  renderReview();
}

function renderKnowledgeReview(){
  const bank = getWrongBank();
  const el = document.getElementById('knowledgeReview');
  if(bank.length===0){el.innerHTML='<div class="empty-state">暂无错题，继续加油！</div>';return}

  const kpCount = {};
  bank.forEach(function(w){kpCount[w.kp]=(kpCount[w.kp]||0)+1});
  const sorted = Object.keys(kpCount).map(function(k){return [k,kpCount[k]]}).sort(function(a,b){return b[1]-a[1]});

  let html = '<p style="font-size:13px;color:#666;margin-bottom:12px">按错误频率排序，共 '+sorted.length+' 个薄弱知识点</p>';
  sorted.forEach(function(entry){
    const kp=entry[0],count=entry[1];
    const info = kpMap[kp] || {title:kp, content:'暂无详细说明，请看教材。'};
    const related = bank.filter(function(w){return w.kp===kp});
    html += '<div class="kp-section">';
    html += '<div class="kp-header"><div class="kp-title">'+info.title+'</div><span class="kp-badge">错 '+count+' 次</span></div>';
    html += '<div class="kp-content">'+info.content+'</div>';
    html += '<div class="kp-wrong-list">相关错题：<br>';
    related.forEach(function(r){
      html += '• '+r.text.substring(0,60)+(r.text.length>60?'...':'')+'<br>';
    });
    html += '</div></div>';
  });
  el.innerHTML = html;
}

window.addEventListener('beforeunload', saveProgress);

(function(){
  const p = loadProgress();
  if(p && p.mode && p.ids && p.ids.length>0 && Date.now()-p.time < 3600000){
    if(confirm('检测到上次未完成的答题进度，是否恢复？')){
      currentMode = p.mode;
      currentQIndex = p.index;
      answers = p.answers || {};
      let pool;
      if(p.mode==='coding') pool = codingQuestions;
      else pool = allQuestions;
      currentQuestions = p.ids.map(function(id){return pool.find(function(q){return q.id===id})}).filter(Boolean);
      if(currentQuestions.length>0){
        document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
        const tm = {normal:0,coding:1,wrongredo:2};
        if(tm[p.mode]!==undefined) document.querySelectorAll('.mode-tab')[tm[p.mode]].classList.add('active');
        renderQuestion();
        return;
      }
    }
    clearProgress();
  }
  startQuiz('normal');
})();
</script>
</body>
</html>
