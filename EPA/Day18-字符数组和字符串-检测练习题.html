<script>
const QUIZ_KEY = 'wrongbank_day18';
const DAY_NUM = 18;

const allQuestions = [
  {"id":1,"type":"single","kp":"字符数组","text":"以下关于字符数组的定义，正确的是？","options":["A. char ch[5] = 'hello';","B. char ch[5] = {'h','e','l','l','o'};","C. char ch[5] = \"hello\";","D. char ch[5] = (hello);"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>字符数组用花括号初始化，每个字符用单引号括起来。A选项用了单引号包裹字符串，C选项\"hello\"需要6个字节（含'\\0'）空间不够，D选项语法错误。"},
  {"id":2,"type":"single","kp":"字符串","text":"字符串 \"hello\" 在内存中占几个字节？","options":["A. 5个","B. 6个","C. 4个","D. 7个"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>字符串 \"hello\" 实际存储为 'h','e','l','l','o','\\0'，共6个字节。末尾的 '\\0' 是字符串的结束标志，C语言自动添加。"},
  {"id":3,"type":"single","kp":"字符串结束标志","text":"字符数组 char ch2[5] = {'a','b','c','d','e'}; 用 printf(\"%s\", ch2); 输出会怎样？","options":["A. 输出 abcde","B. 编译错误","C. 可能输出乱码","D. 输出空字符串"],"correct":"C","correctText":"C","expl":"<strong>解析：</strong>ch2没有'\\0'结束标志，printf(\"%s\")会一直输出直到遇到内存中的'\\0'，因此可能输出abcde后面的乱码。"},
  {"id":4,"type":"single","kp":"字符串初始化","text":"以下哪种方式正确初始化了一个字符串？","options":["A. char s[] = 'hello';","B. char s[] = \"hello\";","C. char s[5] = \"hello\";","D. char s[5] = {'h','e','l','l','o'};"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>B选项正确，编译器自动计算长度为6（含'\\0'）。A选项不能用单引号包裹字符串。C和D选项长度不够，缺少'\\0'的位置。"},
  {"id":5,"type":"single","kp":"二维字符数组","text":"二维字符数组 fruit[][7] = {\"apple\",\"orange\"}; 中，列数7的含义是？","options":["A. 最多存7个字符串","B. 每个字符串最多7个字符（含'\\0'）","C. 每个字符串最多6个字符","D. 数组有7行"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>二维字符数组的列数 = 每个字符串的最大长度（含'\\0'）。列数7表示每个字符串最长为6个有效字符+1个'\\0'。"},
  {"id":6,"type":"single","kp":"gets函数","text":"关于 gets() 函数，以下说法正确的是？","options":["A. gets() 可以安全地读取任意长度的字符串","B. gets() 读取到空格就会停止","C. gets() 不检查数组边界，C11标准已移除","D. gets() 读取时自动添加换行符"],"correct":"C","correctText":"C","expl":"<strong>解析：</strong>gets() 不检查数组边界，输入超过数组长度会越界，极度危险。C11标准已将其移除，推荐使用 fgets() 替代。"},
  {"id":7,"type":"single","kp":"puts函数","text":"puts() 和 printf(\"%s\") 的区别是什么？","options":["A. puts() 可以格式化输出","B. puts() 输出后自动换行","C. puts() 输出不换行","D. 两者完全相同"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>puts() 输出字符串后自动添加换行符 '\\n'，而 printf(\"%s\") 不自动换行。puts() 不能格式化输出，只能输出纯字符串。"},
  {"id":8,"type":"single","kp":"scanf输入","text":"scanf(\"%s\", ch); 中，ch 前面为什么不需要 &？","options":["A. char 类型不需要取地址","B. 数组名本身就是首地址","C. scanf 会自动取地址","D. 以上都不对"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>数组名本身就是数组首元素的地址，即 ch 等价于 &ch[0]。所以 scanf(\"%s\", ch) 中 ch 前面不需要加 &。"},
  {"id":9,"type":"single","kp":"scanf格式","text":"要读取包含空格的整行字符串，应该使用？","options":["A. scanf(\"%s\", ch);","B. scanf(\"%c\", ch);","C. scanf(\"%[^\\n]\", ch);","D. scanf(\"%d\", ch);"],"correct":"C","correctText":"C","expl":"<strong>解析：</strong>%[^\\n] 表示读取除换行符以外的所有字符，可以读取包含空格的整行。%s 遇空格就停止，%c 只读一个字符。"},
  {"id":10,"type":"judge","kp":"字符数组","text":"字符数组部分初始化时，未赋值的元素自动为0（即 '\\0'）。","options":["A. 正确","B. 错误"],"correct":"A","correctText":"A","expl":"<strong>解析：</strong>正确。字符数组和普通数组一样，部分初始化时未赋值的元素自动初始化为0。对于 char 类型，0 就是 '\\0'（空字符）。"},
  {"id":11,"type":"judge","kp":"二维字符数组","text":"二维字符数组定义时，行数和列数都可以省略。","options":["A. 正确","B. 错误"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>错误。二维字符数组行数可以省略（编译器自动推导），但列数绝对不能省略，因为编译器需要知道每行有多少元素。"},
  {"id":12,"type":"judge","kp":"字符串","text":"字符串 \"\" 在内存中占0个字节。","options":["A. 正确","B. 错误"],"correct":"B","correctText":"B","expl":"<strong>解析：</strong>错误。空字符串 \"\" 也包含一个 '\\0'，占1个字节。任何字符串都必须以 '\\0' 结尾。"},
  {"id":13,"type":"fill","kp":"scanf","text":"用 scanf 读取字符串时，格式符是 <input type='text' class='fill-blank' id='f13_0' placeholder='%?' />，要读取带空格的整行用 <input type='text' class='fill-blank' id='f13_1' placeholder='%?' />。","correct":["%s","%[^\\n]"],"correctText":"%s, %[^\\n]","expl":"<strong>解析：</strong>%s 读取到空格/回车/制表符停止；%[^\\n] 读取除换行符外的所有字符，可读取含空格的整行。"},
  {"id":14,"type":"fill","kp":"字符串结束标志","text":"字符串的结束标志是 <input type='text' class='fill-blank' id='f14_0' placeholder='?' />，其ASCII码为 <input type='text' class='fill-blank' id='f14_1' placeholder='?' />。","correct":["\\0","0"],"correctText":"\\0, 0","expl":"<strong>解析：</strong>'\\0'（空字符）是字符串的结束标志，ASCII码为0。所有字符串处理函数都依赖它判断字符串结束位置。"}
];

const codingQuestions = [
  {"id":101,"type":"coding","kp":"字符数组","difficulty":"入门","title":"字符数组遍历","desc":"定义一个字符数组 char ch[] = \"Hello World\"; 用循环遍历每个字符，分别打印每个字符的 ASCII 码和字符本身。","hint":"使用 sizeof(ch)/sizeof(char) 计算数组长度，用 %d 打印 ASCII，%c 打印字符。注意字符串末尾有 \\0。","answer":"#include <stdio.h>\n\nint main() {\n    char ch[] = \"Hello World\";\n    int i;\n    int len = sizeof(ch) / sizeof(char);\n    \n    for (i = 0; i < len; i++) {\n        printf(\"%d %c\\n\", ch[i], ch[i]);\n    }\n    \n    printf(\"数组长度: %d\\n\", len);\n    return 0;\n}"},
  {"id":102,"type":"coding","kp":"二维字符数组","difficulty":"入门","title":"水果列表输出","desc":"定义一个二维字符数组存储5种水果名称：apple, orange, grape, pear, peach。遍历输出每个水果名称。","hint":"使用 char fruit[][7] 定义，列数要足够容纳最长字符串+\"\\0\"。用 sizeof(fruit)/sizeof(fruit[0]) 计算行数。","answer":"#include <stdio.h>\n\nint main() {\n    char fruit[][7] = {\"apple\", \"orange\", \"grape\", \"pear\", \"peach\"};\n    int i;\n    int rows = sizeof(fruit) / sizeof(fruit[0]);\n    \n    for (i = 0; i < rows; i++) {\n        printf(\"%s\\n\", fruit[i]);\n    }\n    \n    return 0;\n}"},
  {"id":103,"type":"coding","kp":"字符串输入输出","difficulty":"简单","title":"读取并输出姓名","desc":"从键盘读取用户输入的姓名（可能包含空格），然后输出 \"Hello, 姓名!\"。使用 scanf(\"%[^\\n]\") 读取整行输入。","hint":"char name[50]; scanf(\"%[^\\n]\", name); 不加 &。注意输入缓冲区问题。","answer":"#include <stdio.h>\n\nint main() {\n    char name[50];\n    \n    printf(\"请输入你的姓名: \");\n    scanf(\"%[^\\n]\", name);\n    \n    printf(\"Hello, %s!\\n\", name);\n    \n    return 0;\n}"}
];

const kpMap = {
  "字符数组":{"title":"字符数组","content":"元素类型为 <code>char</code> 的数组，用 <code>char ch[5];</code> 定义。初始化用花括号：<code>char ch[5] = {'H','e','l','l','o'};</code> 部分初始化时未赋值元素自动为 0（'\\0'）。<strong>遍历方式和普通数组一样。</strong>"},
  "字符串":{"title":"字符串","content":"用双引号括起来的一串字符，本质是<strong>以 '\\0' 结尾的字符数组</strong>。<code>\"hello\"</code> 实际占6个字节（含'\\0'）。初始化推荐：<code>char ch[] = \"hello\";</code> 编译器自动计算长度并加'\\0'。"},
  "字符串结束标志":{"title":"字符串结束标志 '\\0'","content":"'\\0'（ASCII码为0）标记字符串的结束位置。所有字符串处理函数都依赖它。没有'\\0'的字符数组用 <code>%s</code> 输出会乱码。<strong>定义数组长度时一定要+1！</strong>"},
  "字符串初始化":{"title":"字符串初始化","content":"推荐用 <code>char ch[] = \"hello\";</code> 初始化，编译器自动处理长度和'\\0'。<code>char ch[5] = \"hello\";</code> 是错误的，因为长度不够放'\\0'。"},
  "二维字符数组":{"title":"二维字符数组","content":"用于存储多个字符串，<code>char arr[行数][列数];</code> 行数可省略，列数不可省略。列数=最长字符串长度+1。<strong>arr[i] 是第i行首地址，%s 可直接输出。</strong>"},
  "gets函数":{"title":"gets() 函数","content":"读取一行字符串（含空格），读到换行符停止。自动加'\\0'。<strong>不检查边界，极度危险，C11已移除</strong>。推荐使用 fgets() 替代。"},
  "puts函数":{"title":"puts() 函数","content":"输出字符串并<strong>自动换行</strong>。遇到'\\0'停止。比 printf 简单但不能格式化输出。"},
  "scanf输入":{"title":"scanf() 读取字符串","content":"<code>scanf(\"%s\", ch);</code> 读取字符串，遇空格/回车/制表符停止。自动加'\\0'。<strong>不需要 &</strong>，因为数组名就是首地址。"},
  "scanf格式":{"title":"scanf 格式符","content":"<code>%s</code> 遇空格停止，<code>%[^\\n]</code> 遇回车才停止（可读取含空格的整行）。读取带空格的字符串用 <code>scanf(\"%[^\\n]\", ch);</code>"}
};

const extraQuestions = [];

let currentQuestions = [];
let currentQIndex = 0;
let answers = {};
let currentMode = 'normal';
const PROGRESS_KEY = QUIZ_KEY + '_progress';

function getWrongBank(){
  try{return JSON.parse(localStorage.getItem(QUIZ_KEY)||'[]')}catch(e){return []}
}
function saveWrongBank(list){
  localStorage.setItem(QUIZ_KEY, JSON.stringify(list));
}
function addToWrongBank(q, userAns){
  const bank = getWrongBank();
  if(!bank.find(function(x){return x.id===q.id})){
    bank.push({
      id:q.id,type:q.type,kp:q.kp,text:q.text,
      options:q.options,correct:q.correct,correctText:q.correctText,
      expl:q.expl,userAns:userAns,time:Date.now()
    });
    saveWrongBank(bank);
  }
}
function saveProgress(){
  if(currentMode==='review') return;
  var prog = {
    mode:currentMode, index:currentQIndex, answers:answers,
    ids:currentQuestions.map(function(q){return q.id}), time:Date.now()
  };
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(prog));
}
function loadProgress(){
  try{return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null')}catch(e){return null}
}
function clearProgress(){
  localStorage.removeItem(PROGRESS_KEY);
}
function shuffle(arr){
  var a=[];
  for(var i=0;i<arr.length;i++) a.push(arr[i]);
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function openInVSCode(q) {
  var code = q.answer || q.hint || '// 请在此编写代码';
  var blob = new Blob([code], {type: 'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Day'+DAY_NUM+'_'+q.id+'.c';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  var info = document.createElement('div');
  info.className = 'vscode-info';
  info.innerHTML = ' 文件已下载！请在 VSCode 中打开:<br><code>File Open File 选择下载的 '+a.download+'</code><br>或按快捷键 <code>Ctrl+O</code>';
  var container = document.getElementById('quizContainer');
  var oldInfo = container.querySelector('.vscode-info');
  if (oldInfo) oldInfo.remove();
  container.querySelector('.question-card').appendChild(info);
}

function startQuiz(mode){
  clearProgress();
  currentMode = mode;
  currentQIndex = 0;
  answers = {};
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('reviewArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
  var tabMap = {normal:0, coding:1, wrongredo:2, review:3};
  if(tabMap[mode]!==undefined) document.querySelectorAll('.mode-tab')[tabMap[mode]].classList.add('active');

  if(mode==='coding'){
    currentQuestions = [];
    for(var i=0;i<codingQuestions.length;i++) currentQuestions.push(codingQuestions[i]);
  } else if(mode==='wrongredo'){
    var bank = getWrongBank();
    if(bank.length===0){
      alert('错题库为空，没有错题可以重做！');
      switchMode('normal');
      return;
    }
    currentQuestions = bank.map(function(w){return Object.assign({},w,{isWrongRedo:true})});
  } else if(mode==='consolidate'){
    var bank = getWrongBank();
    if(bank.length===0){
      alert('错题库为空，先去做题吧！');
      switchMode('normal');
      return;
    }
    var weakKps = [];
    var seen={};
    for(var i=0;i<bank.length;i++){if(!seen[bank[i].kp]){weakKps.push(bank[i].kp);seen[bank[i].kp]=true;}}
    var pool = allQuestions.filter(function(q){return weakKps.indexOf(q.kp)>=0 && !bank.find(function(w){return w.id===q.id})});
    if(pool.length<5) pool = allQuestions.filter(function(q){return !bank.find(function(w){return w.id===q.id})});
    currentQuestions = shuffle(pool).slice(0, Math.min(10, pool.length));
  } else {
    currentQuestions = [];
    for(var i=0;i<allQuestions.length;i++) currentQuestions.push(allQuestions[i]);
  }

  if(currentQuestions.length===0){
    alert('没有题目！');
    return;
  }
  renderQuestion();
}

function switchMode(mode){
  if(mode==='review'){
    document.getElementById('quizArea').style.display='none';
    document.getElementById('resultCard').classList.remove('show');
    document.getElementById('reviewArea').style.display='block';
    document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.mode-tab')[3].classList.add('active');
    currentMode='review';
    renderReview();
    return;
  }
  startQuiz(mode);
}

function renderQuestion(){
  saveProgress();
  var q = currentQuestions[currentQIndex];
  var total = currentQuestions.length;
  var pct = ((currentQIndex+1)/total)*100;
  document.getElementById('progress').style.width = pct+'%';
  document.getElementById('progressText').textContent = '第 '+(currentQIndex+1)+' / '+total+' 题';

  var html = '<div class="question-card">';
  html += '<span class="question-num">第 '+(currentQIndex+1)+' 题</span>';
  html += '<span class="question-tag">'+q.kp+'</span>';
  if(q.type==='coding'){
    var diffMap = {'入门':'difficulty-easy','简单':'difficulty-easy','中等':'difficulty-mid','困难':'difficulty-hard'};
    html += '<span class="difficulty-tag '+(diffMap[q.difficulty]||'')+'">'+q.difficulty+'</span>';
    html += '<div class="question-text"><strong>'+q.title+'</strong></div>';
    html += '<div class="question-desc">'+q.desc.replace(/\n/g,'<br>')+'</div>';
    html += '<textarea class="code-editor" id="codeEditor" placeholder="// 在这里编写你的代码..."></textarea>';
    html += '<div class="btn-group">';
    html += '<button class="btn btn-vscode" onclick="openInVSCode(currentQuestions[currentQIndex])"> 在VSCode中打开</button>';
    html += '<button class="btn btn-secondary" onclick="showHint()"> 提示</button>';
    html += '<button class="btn btn-warn" onclick="showAnswerCoding()"> 参考答案</button>';
    html += '</div>';
    html += '<div class="hint-box" id="hintBox"> '+q.hint+'</div>';
    html += '<div class="test-result" id="testResult"></div>';
    html += '<div class="answer-display" id="answerDisplay"><strong>参考答案：</strong><pre>'+q.answer.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</pre></div>';
  } else {
    html += '<div class="question-text">'+q.text+'</div>';
    if(q.type==='single' || q.type==='judge'){
      html += '<div class="options">';
      var labels = q.type==='judge'?['A','B']:['A','B','C','D'];
      q.options.forEach(function(opt,i){
        var sel = answers[q.id]===labels[i]?'selected':'';
        html += '<div class="option '+sel+'" onclick="selectOption(\''+labels[i]+'\', event)"><span class="option-label">'+labels[i]+'.</span>'+opt+'</div>';
      });
      html += '</div>';
    } else if(q.type==='fill'){
      html += '<div class="question-text">'+q.text+'</div>';
    }
  }
  html += '<div class="explanation" id="expl"><div class="explanation-title"> 解析</div>'+(q.expl||'')+'</div>';
  html += '<div class="btn-group">';
  if(currentQIndex>0) html += '<button class="btn" onclick="prevQ()">上一题</button>';
  if(q.type==='coding'){
    html += '<button class="btn btn-primary" onclick="nextQ()">下一题</button>';
  } else {
    html += '<button class="btn btn-primary" onclick="submitQ(event)">提交答案</button>';
    if(currentQIndex<currentQuestions.length-1) html += '<button class="btn btn-secondary" onclick="nextQ()" id="nextBtn" style="display:none">下一题</button>';
    else html += '<button class="btn btn-secondary" onclick="finishQuiz()" id="finishBtn" style="display:none"> 完成答题</button>';
  }
  html += '</div></div>';
  document.getElementById('quizContainer').innerHTML = html;
}

function selectOption(label, e){
  var q = currentQuestions[currentQIndex];
  answers[q.id] = label;
  document.querySelectorAll('.option').forEach(function(o){o.classList.remove('selected')});
  e.currentTarget.classList.add('selected');
}

function showHint(){
  document.getElementById('hintBox').classList.toggle('show');
}
function showAnswerCoding(){
  document.getElementById('answerDisplay').classList.toggle('show');
}

function submitQ(e){
  var q = currentQuestions[currentQIndex];
  var userAns = answers[q.id];
  var isCorrect = false;

  if(q.type==='fill'){
    var inputs = document.querySelectorAll('.fill-blank');
    userAns = Array.from(inputs).map(function(i){return i.value.trim()});
    isCorrect = q.correct.every(function(c,i){return userAns[i] && userAns[i].toLowerCase()===c.toLowerCase()});
    if(!isCorrect) addToWrongBank(q, userAns.join(' | '));
  } else {
    if(!userAns){
      alert('请先选择一个答案！');
      return;
    }
    isCorrect = userAns===q.correct;
    if(!isCorrect) addToWrongBank(q, userAns||'未作答');
  }

  if(q.type==='single' || q.type==='judge'){
    document.querySelectorAll('.option').forEach(function(o,i){
      var labels = q.type==='judge'?['A','B']:['A','B','C','D'];
      if(labels[i]===q.correct) o.classList.add('correct');
      else if(labels[i]===userAns) o.classList.add('wrong');
      o.style.pointerEvents='none';
    });
  } else if(q.type==='fill'){
    document.querySelectorAll('.fill-blank').forEach(function(inp,i){
      inp.disabled = true;
      if(inp.value.trim().toLowerCase()===q.correct[i].toLowerCase()){
        inp.style.background='#d4edda';inp.style.borderColor='#27ae60';
      } else {
        inp.style.background='#f8d7da';inp.style.borderColor='#e74c3c';
        inp.title = '正确答案: '+q.correct[i];
      }
    });
  }

  document.getElementById('expl').classList.add('show');
  var nb = document.getElementById('nextBtn');
  var fb = document.getElementById('finishBtn');
  if(nb) nb.removeAttribute('style');
  if(fb) fb.removeAttribute('style');
  e.currentTarget.style.display='none';
  saveProgress();
}

function prevQ(){
  if(currentQIndex>0){currentQIndex--;renderQuestion()}
}
function nextQ(){
  if(currentQIndex<currentQuestions.length-1){currentQIndex++;renderQuestion()}
  else finishQuiz();
}

function finishQuiz(){
  saveProgress();
  var correct=0, wrongList=[];
  currentQuestions.forEach(function(q){
    if(q.type==='coding') return;
    var ua = answers[q.id];
    var ok=false;
    if(q.type==='fill'){
      var ual = (ua||[]);
      ok = Array.isArray(ual) && q.correct.every(function(c,i){return ual[i] && ual[i].toLowerCase()===c.toLowerCase()});
    } else { ok = ua===q.correct; }
    if(ok) correct++; else wrongList.push({q:q,userAns:Array.isArray(ua)?ua.join(' | '):(ua||'未作答')});
  });

  var total = currentQuestions.filter(function(q){return q.type!=='coding'}).length;
  var wrong = total - correct;
  var score = total>0 ? Math.round(correct/total*100) : 0;

  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('score').textContent = score;
  document.getElementById('score').style.color = score>=90?'#27ae60':score>=60?'#f39c12':'#e74c3c';
  document.getElementById('message').textContent = score>=90?' 太棒了！掌握得很好！':score>=60?' 继续努力，还有提升空间！':' 基础还需加强，多复习知识点！';
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('totalCount').textContent = total;

  if(wrongList.length>0){
    document.getElementById('wrongBankPreview').style.display='block';
    var html='';
    wrongList.forEach(function(w){
      html += '<div class="wrong-item"><div class="wq">'+w.q.kp+': '+w.q.text.substring(0,50)+'...</div><div class="wa">你的答案: '+w.userAns+'</div><div class="wc">正确答案: '+(w.q.correctText||w.q.correct)+'</div></div>';
    });
    document.getElementById('wrongPreviewList').innerHTML = html;
  } else {
    document.getElementById('wrongBankPreview').style.display='none';
  }
  clearProgress();
}

function renderReview(){
  var bank = getWrongBank();
  document.getElementById('wrongBankCount').textContent = bank.length;
  switchReviewTab('list');
}

function switchReviewTab(tab){
  document.querySelectorAll('.review-tab').forEach(function(t){t.classList.remove('active')});
  if(event&&event.target) event.target.classList.add('active');
  else document.querySelectorAll('.review-tab')[tab==='list'?0:1].classList.add('active');
  document.getElementById('wrongBankList').style.display = tab==='list'?'block':'none';
  document.getElementById('knowledgeReview').style.display = tab==='knowledge'?'block':'none';
  if(tab==='list') renderWrongList();
  else renderKnowledgeReview();
}

function renderWrongList(){
  var bank = getWrongBank();
  var el = document.getElementById('wrongBankList');
  if(bank.length===0){el.innerHTML='<div class="empty-state">暂无错题，继续加油！</div>';return}
  var html='';
  bank.sort(function(a,b){return b.time-a.time}).forEach(function(w,i){
    html += '<div class="kp-section" style="border-left-color:#e74c3c">';
    html += '<div class="kp-header"><div class="kp-title">'+(i+1)+'. '+w.kp+'</div>';
    html += '<button class="btn" style="background:#e74c3c;color:white;padding:3px 10px;font-size:11px" onclick="removeWrong('+w.id+')">删除</button></div>';
    html += '<div class="kp-content">'+w.text+'</div>';
    if(w.options){
      html += '<div class="options" style="margin-top:8px">';
      var labels = w.type==='judge'?['A','B']:['A','B','C','D'];
      w.options.forEach(function(opt,j){
        var cls = labels[j]===w.correct?'correct':(labels[j]===w.userAns?'wrong':'');
        html += '<div class="option '+cls+'" style="cursor:default;pointer-events:none"><span class="option-label">'+labels[j]+'.</span>'+opt+'</div>';
      });
      html += '</div>';
    }
    html += '<div class="explanation show"><div class="explanation-title"> 解析</div>'+(w.expl||'')+'</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function removeWrong(id){
  if(!confirm('确定删除这道错题吗？')) return;
  var bank = getWrongBank().filter(function(w){return w.id!==id});
  saveWrongBank(bank);
  renderReview();
}

function clearWrongBank(){
  if(!confirm('确定清空所有错题吗？此操作不可恢复！')) return;
  saveWrongBank([]);
  renderReview();
}

function renderKnowledgeReview(){
  var bank = getWrongBank();
  var el = document.getElementById('knowledgeReview');
  if(bank.length===0){el.innerHTML='<div class="empty-state">暂无错题，继续加油！</div>';return}

  var kpCount = {};
  bank.forEach(function(w){kpCount[w.kp]=(kpCount[w.kp]||0)+1});
  var sorted = Object.keys(kpCount).map(function(k){return [k,kpCount[k]]}).sort(function(a,b){return b[1]-a[1]});

  var html = '<p style="font-size:13px;color:#666;margin-bottom:12px">按错误频率排序，共 '+sorted.length+' 个薄弱知识点</p>';
  sorted.forEach(function(entry){
    var kp=entry[0],count=entry[1];
    var info = kpMap[kp] || {title:kp, content:'暂无详细说明，请看教材。'};
    var related = bank.filter(function(w){return w.kp===kp});
    html += '<div class="kp-section">';
    html += '<div class="kp-header"><div class="kp-title">'+info.title+'</div><span class="kp-badge">错 '+count+' 次</span></div>';
    html += '<div class="kp-content">'+info.content+'</div>';
    html += '<div class="kp-wrong-list">相关错题：<br>';
    related.forEach(function(r){
      html += ' '+r.text.substring(0,60)+(r.text.length>60?'...':'')+'<br>';
    });
    html += '</div></div>';
  });
  el.innerHTML = html;
}

window.addEventListener('beforeunload', saveProgress);

(function(){
  var p = loadProgress();
  if(p && p.mode && p.ids && p.ids.length>0 && Date.now()-p.time < 3600000){
    if(confirm('检测到上次未完成的答题进度，是否恢复？')){
      currentMode = p.mode;
      currentQIndex = p.index;
      answers = p.answers || {};
      var pool;
      if(p.mode==='coding') pool = codingQuestions;
      else pool = allQuestions;
      currentQuestions = p.ids.map(function(id){return pool.find(function(q){return q.id===id})}).filter(Boolean);
      if(currentQuestions.length>0){
        document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
        var tm = {normal:0,coding:1,wrongredo:2};
        if(tm[p.mode]!==undefined) document.querySelectorAll('.mode-tab')[tm[p.mode]].classList.add('active');
        renderQuestion();
        return;
      }
    }
    clearProgress();
  }
  startQuiz('normal');
})();
</script>
