: "A", "options": ["正确", "错误"], "expl": "<strong>正确！</strong>do-while 先执行循环体，再判断条件，所以无论条件是否为真，循环体至少执行一次。"}, {"id": 14, "type": "judge", "kp": "while语法", "text": "while 循环的循环体至少执行一次。", "correct": "B", "options": ["正确", "错误"], "expl": "<strong>错误！</strong>while 先判断条件，如果一开始条件就为假，循环体一次都不执行。"}, {"id": 15, "type": "judge", "kp": "最大公约数", "text": "辗转相除法中，当余数为 0 时，除数就是最大公约数。", "correct": "A", "options": ["正确", "错误"], "expl": "<strong>正确！</strong>这是辗转相除法的核心思想：当 a%b==0 时，b 就是 a 和 b 的最大公约数。"}, {"id": 16, "type": "judge", "kp": "goto", "text": "goto 语句可以在不同函数之间跳转。", "correct": "B", "options": ["正确", "错误"], "expl": "<strong>错误！</strong>goto 只能在同一个函数内跳转，不能跨函数跳转。跨函数跳转需要用 longjmp（不推荐）。"}, {"id": 17, "type": "judge", "kp": "死循环", "text": "while(1) 是死循环，无法跳出。", "correct": "B", "options": ["正确", "错误"], "expl": "<strong>错误！</strong>while(1) 是死循环，但可以在循环体内用 break 跳出。很多菜单系统就用 while(1)+break 的模式。"}, {"id": 18, "type": "fill", "kp": "最大公约数", "text": "最小公倍数 = 两数之 <input class=\"fill-blank\" data-idx=\"0\" placeholder=\"?\"> 除以最大 <input class=\"fill-blank\" data-idx=\"1\" placeholder=\"?\">。", "correct": ["积", "乘积", "*", "公约数", "GCD"], "correctText": "积（乘积） | 公约数（GCD）", "expl": "<strong>LCM(a,b) = a×b / GCD(a,b)</strong>。最小公倍数等于两数的乘积除以最大公约数。"}, {"id": 19, "type": "fill", "kp": "循环对比", "text": "for适合 <input class=\"fill-blank\" data-idx=\"0\" placeholder=\"?\"> 次数的场景，while适合 <input class=\"fill-blank\" data-idx=\"1\" placeholder=\"?\"> 次数的场景。", "correct": ["已知", "确定", "未知", "不确定"], "correctText": "已知（确定） | 未知（不确定）", "expl": "<strong>已知次数→for</strong>（结构清晰），<strong>未知次数→while</strong>（靠条件结束）。"}, {"id": 20, "type": "fill", "kp": "dowhile语法", "text": "do-while 语句末尾必须有一个 <input class=\"fill-blank\" data-idx=\"0\" placeholder=\"符号\">，这是最容易出错的地方。", "correct": [";", "分号"], "correctText": "分号（;）", "expl": "<strong>do { ... } while (条件);</strong> 末尾的分号绝对不能省略！"}];

 输出：5050", "hint": "int i=1,sum=0; while(i<=n){sum+=i; i++;}", "answer": "#include <stdio.h>\nint main() {\n    int n, i, sum;\n    scanf(\"%d\", &n);\n    i = 1;\n    sum = 0;\n    while (i <= n) {\n        sum += i;\n        i++;\n    }\n    printf(\"%d\\n\", sum);\n    return 0;\n}", "test_input": "100", "expected_output": "5050"}, {"id": 102, "type": "coding", "kp": "do-while基础", "difficulty": "入门", "title": "1到n求和（do-while版）", "desc": "编写程序，输入正整数n，用do-while循环计算1+2+...+n的和并输出。\n注意末尾分号不能省！", "hint": "do { sum+=i; i++; } while(i<=n);", "answer": "#include <stdio.h>\nint main() {\n    int n, i, sum;\n    scanf(\"%d\", &n);\n    i = 1;\n    sum = 0;\n    do {\n        sum += i;\n        i++;\n    } while (i <= n);\n    printf(\"%d\\n\", sum);\n    return 0;\n}", "test_input": "100", "expected_output": "5050"}, {"id": 103, "type": "coding", "kp": "数位拆分", "difficulty": "简单", "title": "求一个整数的位数", "desc": "编写程序，输入一个正整数，用while循环统计它是几位数并输出。\n例：输入 12345 → 输出：5\n     输入 999 → 输出：3", "hint": "每次n=n/10去掉一位，计数器count++，直到n变为0。", "answer": "#include <stdio.h>\nint main() {\n    int n, count = 0;\n    scanf(\"%d\", &n);\n    while (n > 0) {\n        n = n / 10;\n        count++;\n    }\n    printf(\"%d\\n\", count);\n    return 0;\n}", "test_input": "12345", "expected_output": "5"}, {"id": 104, "type": "coding", "kp": "数位拆分", "difficulty": "中等", "title": "整数反转", "desc": "编写程序，输入一个正整数，用while循环将它反转输出。\n例：输入 12345 → 输出：54321\n     输入 100 → 输出：1", "hint": "每次取n%10得到最后一位，加到反转结果中：rev=rev*10+n%10; 然后n=n/10。", "answer": "#include <stdio.h>\nint main() {\n    int n, rev = 0;\n    scanf(\"%d\", &n);\n    while (n > 0) {\n        rev = rev * 10 + n % 10;\n        n = n / 10;\n    }\n    printf(\"%d\\n\", rev);\n    return 0;\n}", "test_input": "12345", "expected_output": "54321"}, {"id": 105, "type": "coding", "kp": "最大公约数", "difficulty": "简单", "title": "求最大公约数", "desc": "编写程序，输入两个正整数，用辗转相除法求它们的最大公约数并输出。\n例：输入 12 18 → 输出：6", "hint": "确保a>=b，while((c=a%b)!=0){a=b; b=c;} 结果是b。", "answer": "#include <stdio.h>\nint main() {\n    int a, b, c, t;\n    scanf(\"%d%d\", &a, &b);\n    if (a < b) { t = a; a = b; b = t; }\n    while ((c = a % b) != 0) {\n        a = b;\n        b = c;\n    }\n    printf(\"%d\\n\", b);\n    return 0;\n}", "test_input": "12 18", "expected_output": "6"}, {"id": 106, "type": "coding", "kp": "最大公约数", "difficulty": "简单", "title": "求最小公倍数", "desc": "编写程序，输入两个正整数，求它们的最小公倍数并输出。\n提示：LCM = a*b / GCD\n例：输入 12 18 → 输出：36", "hint": "先保存乘积t=a*b，求出GCD后，LCM=t/GCD。", "answer": "#include <stdio.h>\nint main() {\n    int a, b, c, t, gcd;\n    scanf(\"%d%d\", &a, &b);\n    t = a * b;\n    if (a < b) { int tmp = a; a = b; b = tmp; }\n    while ((c = a % b) != 0) {\n        a = b;\n        b = c;\n    }\n    gcd = b;\n    printf(\"%d\\n\", t / gcd);\n    return 0;\n}", "test_input": "12 18", "expected_output": "36"}, {"id": 107, "type": "coding", "kp": "水仙花数", "difficulty": "简单", "title": "while版水仙花数", "desc": "编写程序，用while循环输出所有的三位水仙花数。\n水仙花数：一个3位数，各位数字的立方和等于该数本身。\n例：153 = 1^3 + 5^3 + 3^3 = 153", "hint": "n从100到999，每次提取百位a=n/100，十位b=n%100/10，个位c=n%10。", "answer": "#include <stdio.h>\nint main() {\n    int n = 100;\n    int a, b, c;\n    while (n <= 999) {\n        a = n / 100;\n        b = n % 100 / 10;\n        c = n % 10;\n        if (a*a*a + b*b*b + c*c*c == n) {\n            printf(\"%d\\n\", n);\n        }\n        n++;\n    }\n    return 0;\n}", "test_input": "", "expected_output": "153\n370\n371\n407"}, {"id": 108, "type": "coding", "kp": "素数判断", "difficulty": "简单", "title": "判断一个数是否为素数", "desc": "编写程序，输入一个大于1的正整数，判断它是否为素数。\n是素数输出：Yes，不是输出：No。\n例：输入 7 → 输出：Yes\n     输入 9 → 输出：No", "hint": "从2到n-1检查有没有数能整除n。用flag=1假设是素数，发现能整除则flag=0。", "answer": "#include <stdio.h>\nint main() {\n    int n, i, flag = 1;\n    scanf(\"%d\", &n);\n    i = 2;\n    while (i <= n - 1) {\n        if (n % i == 0) {\n            flag = 0;\n            break;\n        }\n        i++;\n    }\n    if (flag) printf(\"Yes\\n\");\n    else printf(\"No\\n\");\n    return 0;\n}", "test_input": "7", "expected_output": "Yes"}, {"id": 109, "type": "coding", "kp": "素数判断", "difficulty": "中等", "title": "输出100以内所有素数", "desc": "编写程序，用while嵌套循环输出100以内的所有素数，并统计个数。\n每行输出一个素数，最后输出总个数。", "hint": "外层while(n<100)遍历，内层while判断每个n是否为素数。2是最小的素数。", "answer": "#include <stdio.h>\nint main() {\n    int n = 2, i, flag, count = 0;\n    while (n < 100) {\n        i = 2;\n        flag = 1;\n        while (i <= n - 1) {\n            if (n % i == 0) { flag = 0; break; }\n            i++;\n        }\n        if (flag) { printf(\"%d\\n\", n); count++; }\n        n++;\n    }\n    printf(\"count=%d\\n\", count);\n    return 0;\n}", "test_input": "", "expected_output": "素数列表+count=25"}, {"id": 110, "type": "coding", "kp": "while输入", "difficulty": "中等", "title": "统计多组输入的和与偶数个数", "desc": "编写程序，循环读取输入的整数，直到输入非数字结束。\n输出所有输入数字的总和，以及其中偶数的个数。\n输入格式：每行或每空格输入一个整数，按Ctrl+Z（Windows）结束输入。", "hint": "while((ret=scanf(\"%d\",&num))==1) { sum+=num; if(num%2==0) count++; }", "answer": "#include <stdio.h>\nint main() {\n    int num, sum = 0, count = 0, ret;\n    while ((ret = scanf(\"%d\", &num)) == 1) {\n        sum += num;\n        if (num % 2 == 0) count++;\n    }\n    printf(\"sum=%d count=%d\\n\", sum, count);\n    return 0;\n}", "test_input": "1 2 3 4 5", "expected_output": "sum=15 count=2"}];

const kpMap = {"while语法": {"title": "while 循环语法", "content": "<strong>while(条件) { 循环体; }</strong><br>先判断条件，为真执行循环体，为假跳出。<br>⚠️ <strong>注意</strong>：① 循环变量必须在while前初始化 ② 循环体内必须更新循环变量（i++）否则死循环。"}, "dowhile语法": {"title": "do-while 循环语法", "content": "<strong>do { 循环体; } while(条件);</strong><br>先执行一次循环体，再判断条件。<br>⚠️ <strong>末尾分号不能省！</strong>这是do-while最容易出错的地方。"}, "while vs do-while": {"title": "while 与 do-while 对比", "content": "<strong>while</strong>：先判断后执行，最少 0 次<br><strong>do-while</strong>：先执行后判断，最少 1 次<br>💡 大多数情况可以互换，但菜单等必须先执行的场景用 do-while。"}, "最大公约数": {"title": "辗转相除法求 GCD", "content": "<strong>核心算法</strong>：<br>① c = a % b<br>② 若 c == 0，则 b 是 GCD<br>③ 否则 a = b, b = c，重复<br>💡 <strong>注意</strong>：先确保 a >= b（不够就交换），结果存在 b 中。"}, "最小公倍数": {"title": "求最小公倍数 LCM", "content": "<strong>LCM(a, b) = a × b / GCD(a, b)</strong><br>💡 <strong>注意</strong>：先保存乘积 t = a * b！因为求 GCD 的过程中 a 和 b 的值会被修改。"}, "数位拆分": {"title": "提取数字各位", "content": "<strong>百位</strong>：n / 100（整数除法去掉低位）<br><strong>十位</strong>：n % 100 / 10（先去百位再去个位）<br><strong>个位</strong>：n % 10（取余保留最后一位）<br>💡 口诀：/ 去低位，% 留低位。"}, "素数判断": {"title": "判断素数的方法", "content": "<strong>定义</strong>：只能被 1 和自身整除的大于 1 的自然数。<br><strong>方法</strong>：检查 2 到 n-1 有没有数能整除 n。<br><strong>优化</strong>：只需检查到 sqrt(n)，因为因数成对出现。<br>💡 2 是唯一的偶素数！"}, "while输入": {"title": "while 处理多组输入", "content": "<strong>scanf 返回值</strong>：成功读取的变量个数。<br><code>while ((ret = scanf(\"%d\", &num)) == 1)</code><br>返回 1 表示读了一个数，返回其他（非数字/EOF）时结束。<br>💡 Windows 按 Ctrl+Z 结束，Linux 按 Ctrl+D。"}, "break continue": {"title": "break 与 continue", "content": "<strong>break</strong>：立即跳出<strong>当前层</strong>循环（不干了）<br><strong>continue</strong>：跳过本次循环剩余语句，进入<strong>下一次</strong>（这次算了，下次继续）<br>💡 break 只能跳一层，要跳多层用 goto。"}, "goto": {"title": "goto 语句", "content": "<strong>语法</strong>：<code>goto 标签;</code> 跳转到 <code>标签:</code> 位置<br><strong>✅ 合理用法</strong>：① 跳出多层循环 ② 错误处理统一清理<br><strong>❌ 不合理用法</strong>：代替正常循环、随意跳转（面条代码）<br>💡 节制使用！"}, "循环对比": {"title": "三种循环选择", "content": "<strong>for</strong>：已知循环次数，结构清晰<br><strong>while</strong>：未知次数，靠条件结束<br><strong>do-while</strong>：至少执行一次<br>💡 三者可以互相转换，选择合适的写法让代码更清晰。"}};

function getWrongBank(){

  try{return JSON.parse(localStorage.getItem(QUIZ_KEY)||'[]')}catch(e){return []}

}

function saveWrongBank(list){

  localStorage.setItem(QUIZ_KEY, JSON.stringify(list));

}

function addToWrongBank(q, userAns){

  const bank = getWrongBank();

  if(!bank.find(x=>x.id===q.id)){

    bank.push({

      id:q.id,type:q.type,kp:q.kp,text:q.text,

      options:q.options,correct:q.correct,correctText:q.correctText,

      expl:q.expl,userAns:userAns,time:Date.now()

    });

    saveWrongBank(bank);

  }

}

function saveProgress(){

  if(currentMode==='review') return;

  const prog = {

    mode:currentMode, index:currentQIndex, answers:answers,

    ids:currentQuestions.map(q=>q.id), time:Date.now()

  };

  localStorage.setItem(PROGRESS_KEY, JSON.stringify(prog));

}

function loadProgress(){

  try{return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null')}catch(e){return null}

}

function clearProgress(){

  localStorage.removeItem(PROGRESS_KEY);

}

function shuffle(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}



function openInVSCode(q) {

  const code = q.answer || q.hint || '// 请在此编写代码';

  const blob = new Blob([code], {type: 'text/plain'});

  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');

  a.href = url;

  a.download = `Day${DAY_NUM}_${q.id}.c`;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);

  

  // 显示提示

  info.className = 'vscode-info';

 Open File → 选择下载的 ${a.download}</code><br>或按快捷键 <code>Ctrl+O</code>`;

  const container = document.getElementById('quizContainer');

  const oldInfo = container.querySelector('.vscode-info');

  if (oldInfo) oldInfo.remove();

  container.querySelector('.question-card').appendChild(info);

function startQuiz(mode){

  clearProgress();

  currentMode = mode;

  currentQIndex = 0;

  answers = {};

  submitted = {};

  document.getElementById('resultCard').classList.remove('show');

  document.getElementById('reviewArea').style.display = 'none';

  document.getElementById('quizArea').style.display = 'block';

  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));

  const tabMap = {normal:0, coding:1, wrongredo:2, review:3};

  if(tabMap[mode]!==undefined) document.querySelectorAll('.mode-tab')[tabMap[mode]].classList.add('active');



  if(mode==='coding'){

    currentQuestions = [...codingQuestions];

  } else if(mode==='wrongredo'){

    const bank = getWrongBank();

    if(bank.length===0){

      alert('错题库为空，没有错题可以重做！');

      switchMode('normal');

      return;

    }

    currentQuestions = bank.map(w=>({...w, isWrongRedo:true}));

  } else if(mode==='consolidate'){

    const bank = getWrongBank();

    if(bank.length===0){

      alert('错题库为空，先去做题吧！');

      switchMode('normal');

      return;

    }

    const weakKps = [...new Set(bank.map(w=>w.kp))];

    let pool = allQuestions.filter(q=>weakKps.includes(q.kp) && !bank.find(w=>w.id===q.id));

    if(pool.length<5) pool = allQuestions.filter(q=>!bank.find(w=>w.id===q.id));

    currentQuestions = shuffle(pool).slice(0, Math.min(10, pool.length));

  } else {

    currentQuestions = [...allQuestions];

  }



  if(currentQuestions.length===0){

    alert('没有题目！');

    return;

  }

  renderQuestion();

}



function switchMode(mode){

  if(mode==='review'){

    document.getElementById('quizArea').style.display='none';

    document.getElementById('resultCard').classList.remove('show');

    document.getElementById('reviewArea').style.display='block';

    document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));

    document.querySelectorAll('.mode-tab')[3].classList.add('active');

    currentMode='review';

    renderReview();

    return;

  }

  startQuiz(mode);

}

      inp.disabled = true;

      if(userAns[i] && userAns[i].toLowerCase()===q.correct[i].toLowerCase()){

        inp.style.background='#d4edda';inp.style.borderColor='#27ae60';

      } else {

        inp.style.background='#f8d7da';inp.style.borderColor='#e74c3c';

        inp.title = '正确答案: '+q.correct[i];

      }

    });

  }

}



function selectOption(label, e){

  const q = currentQuestions[currentQIndex];

  answers[q.id] = label;

  document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));

  e.currentTarget.classList.add('selected');

}



function showHint(){

  document.getElementById('hintBox').classList.toggle('show');

}

function showAnswerCoding(){

  document.getElementById('answerDisplay').classList.toggle('show');

}



function submitQ(){

  const q = currentQuestions[currentQIndex];

  let userAns = answers[q.id];

  let isCorrect = false;



  if(q.type==='fill'){

    const inputs = document.querySelectorAll('.fill-blank');

    userAns = Array.from(inputs).map(i=>i.value.trim());

    isCorrect = q.correct.every((c,i)=>userAns[i] && userAns[i].toLowerCase()===c.toLowerCase());

    if(!isCorrect) addToWrongBank(q, userAns.join(' | '));

  } else {

    if(!userAns){

      alert('请先选择一个答案！');

      return;

    }

    isCorrect = userAns===q.correct;

    if(!isCorrect) addToWrongBank(q, userAns||'未作答');

  }



  submitted[q.id] = isCorrect;

  saveProgress();

  renderQuestion();

}



function prevQ(){

  if(currentQIndex>0){currentQIndex--;renderQuestion()}

}

function goNext(){
  if(currentQIndex < currentQuestions.length - 1){
    currentQIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
  window.scrollTo(0,0);
}

function nextQ(){

  if(currentQIndex<currentQuestions.length-1){currentQIndex++;renderQuestion()}

  else finishQuiz();

}



function finishQuiz(){

  saveProgress();

  let correct=0, wrongList=[];

  currentQuestions.forEach(q=>{

    if(q.type==='coding') return;

    const ua = answers[q.id];

    let ok=false;

    if(q.type==='fill'){

      const ual = (ua||[]);

      ok = Array.isArray(ual) && q.correct.every((c,i)=>ual[i] && ual[i].toLowerCase()===c.toLowerCase());

    } else { ok = ua===q.correct; }

    if(ok) correct++; else wrongList.push({q,userAns:Array.isArray(ua)?ua.join(' | '):(ua||'未作答')});

  });



  const total = currentQuestions.filter(q=>q.type!=='coding').length;

  const wrong = total - correct;

  const score = total>0 ? Math.round(correct/total*100) : 0;



  document.getElementById('quizArea').style.display='none';

  document.getElementById('resultCard').classList.add('show');

  document.getElementById('score').textContent = score;

  document.getElementById('score').style.color = score>=90?'#27ae60':score>=60?'#f39c12':'#e74c3c';

  document.getElementById('message').textContent = score>=90?'🎉 太棒了！掌握得很好！':score>=60?'👍 继续努力，还有提升空间！':'💪 基础还需加强，多复习知识点！';

  document.getElementById('correctCount').textContent = correct;

  document.getElementById('wrongCount').textContent = wrong;

  document.getElementById('totalCount').textContent = total;



  if(wrongList.length>0){

    document.getElementById('wrongBankPreview').style.display='block';

    let html='';

    wrongList.forEach(w=>{

      html += `<div class="wrong-item"><div class="wq">${w.q.kp}: ${w.q.text.substring(0,50)}...</div><div class="wa">你的答案: ${w.userAns}</div><div class="wc">正确答案: ${w.q.correctText||w.q.correct}</div></div>`;

    });

    document.getElementById('wrongPreviewList').innerHTML = html;

  } else {

    document.getElementById('wrongBankPreview').style.display='none';

  }

  clearProgress();

}



function renderReview(){

  const bank = getWrongBank();

  document.getElementById('wrongBankCount').textContent = bank.length;

  switchReviewTab('list');

}



function switchReviewTab(tab, e){

  document.querySelectorAll('.review-tab').forEach(t=>t.classList.remove('active'));

  e?.target?.classList.add('active');

  if(!e) document.querySelectorAll('.review-tab')[tab==='list'?0:1].classList.add('active');

  document.getElementById('wrongBankList').style.display = tab==='list'?'block':'none';

  document.getElementById('knowledgeReview').style.display = tab==='knowledge'?'block':'none';

  if(tab==='list') renderWrongList();

  else renderKnowledgeReview();

}



function renderWrongList(){

  const bank = getWrongBank();

  const el = document.getElementById('wrongBankList');

  if(bank.length===0){el.innerHTML='<div class="empty-state">暂无错题，继续加油！</div>';return}

  let html='';

  bank.sort((a,b)=>b.time-a.time).forEach((w,i)=>{

    html += `<div class="kp-section" style="border-left-color:#e74c3c">`;

    html += `<div class="kp-header"><div class="kp-title">${i+1}. ${w.kp}</div>`;

    html += `<button class="btn" style="background:#e74c3c;color:white;padding:3px 10px;font-size:11px" onclick="removeWrong(${w.id})">删除</button></div>`;

    html += `<div class="kp-content">${w.text}</div>`;

    if(w.options){

      html += `<div class="options" style="margin-top:8px">`;

      const labels = w.type==='judge'?['A','B']:['A','B','C','D'];

      w.options.forEach((opt,j)=>{

        const cls = labels[j]===w.correct?'correct':(labels[j]===w.userAns?'wrong':'');

        html += `<div class="option ${cls}" style="cursor:default;pointer-events:none"><span class="option-label">${labels[j]}.</span>${opt}</div>`;

      });

      html += `</div>`;

    }

    html += `<div class="explanation show"><div class="explanation-title">📖 解析</div>${w.expl||''}</div>`;

    html += `</div>`;

  });

  el.innerHTML = html;

}



function removeWrong(id){

  if(!confirm('确定删除这道错题吗？')) return;

  const bank = getWrongBank().filter(w=>w.id!==id);

  saveWrongBank(bank);

  renderReview();

}



function clearWrongBank(){

  if(!confirm('确定清空所有错题吗？此操作不可恢复！')) return;

  saveWrongBank([]);

  renderReview();

}



function renderKnowledgeReview(){

  const bank = getWrongBank();

  const el = document.getElementById('knowledgeReview');

  if(bank.length===0){el.innerHTML='<div class="empty-state">暂无错题，继续加油！</div>';return}



  const kpCount = {};

  bank.forEach(w=>{kpCount[w.kp]=(kpCount[w.kp]||0)+1});

  const sorted = Object.entries(kpCount).sort((a,b)=>b[1]-a[1]);



  let html = `<p style="font-size:13px;color:#666;margin-bottom:12px">按错误频率排序，共 ${sorted.length} 个薄弱知识点</p>`;

  sorted.forEach(([kp,count])=>{

    const info = kpMap[kp] || {title:kp, content:'暂无详细说明，请看教材。'};

    const related = bank.filter(w=>w.kp===kp);

    html += `<div class="kp-section">`;

    html += `<div class="kp-header"><div class="kp-title">${info.title}</div><span class="kp-badge">错 ${count} 次</span></div>`;

    html += `<div class="kp-content">${info.content}</div>`;

    html += `<div class="kp-wrong-list">相关错题：<br>`;

    related.forEach(r=>{

      html += `• ${r.text.substring(0,60)}${r.text.length>60?'...':''}<br>`;

    });

    html += `</div></div>`;

  });

  el.innerHTML = html;

}



window.addEventListener('beforeunload', saveProgress);



(function(){

  const p = loadProgress();

  if(p && p.mode && p.ids && p.ids.length>0 && Date.now()-p.time < 3600000){

    if(confirm('检测到上次未完成的答题进度，是否恢复？')){

      currentMode = p.mode;

      currentQIndex = p.index;

      answers = p.answers || {};

      let pool;

      if(p.mode==='coding') pool = codingQuestions;

      else pool = allQuestions;

      currentQuestions = p.ids.map(id=>pool.find(q=>q.id===id)).filter(Boolean);

      if(currentQuestions.length>0){

        document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));

        const tm = {normal:0,coding:1,wrongredo:2};

        if(tm[p.mode]!==undefined) document.querySelectorAll('.mode-tab')[tm[p.mode]].classList.add('active');

        renderQuestion();

        return;

      }

    }

    clearProgress();

  }

  startQuiz('normal');

})();

</script>

</body>

</html>
