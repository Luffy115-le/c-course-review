<script>

const QUIZ_KEY = 'wrongbank_day16';

const DAY_NUM = 16;



const allQuestions = [{"id": 1, "type": "single", "kp": "数组定义", "text": "以下数组定义正确的是？", "options": ["int n=5; int a[n];", "int a[5];", "int a[5.0];", "int a[];"], "correct": "B", "expl": "<strong>数组长度必须是常量或常量表达式</strong>。A选项n是变量，错误；C选项5.0是浮点数，错误；D选项没有初始化也不指定长度，错误。只有B正确。"}, {"id": 2, "type": "single", "kp": "数组下标", "text": "int a[5]; 以下哪个是合法的访问？", "options": ["a[5]", "a[0]", "a[-1]", "a[100]"], "correct": "B", "expl": "<strong>数组下标范围是 0 ~ n-1</strong>。长度为5，合法下标是0、1、2、3、4。只有a[0]合法。"}, {"id": 3, "type": "single", "kp": "数组初始化", "text": "int a[5] = {1, 2}; 则 a[3] 的值是？", "options": ["1", "2", "0", "不确定（垃圾值）"], "correct": "C", "expl": "<strong>部分初始化时，未赋值的元素自动为0</strong>。a[0]=1, a[1]=2, a[2]=0, a[3]=0, a[4]=0。"}, {"id": 4, "type": "single", "kp": "数组名", "text": "关于数组名 a，以下说法正确的是？", "options": ["a 是第一个元素的值", "a 和 &a[0] 等价，都是首地址", "a 可以被重新赋值", "a[0] 的地址等于 a[1] 的地址"], "correct": "B", "expl": "<strong>数组名就是数组首元素的地址</strong>。a 和 &a[0] 的值完全相同。a是常量指针，不能被赋值。元素地址是递增的。"}, {"id": 5, "type": "single", "kp": "数组长度", "text": "int a[] = {5, 1, 4, 9, 12}; 则 sizeof(a)/sizeof(int) 的值是？", "options": ["4", "5", "20", "不确定"], "correct": "B", "expl": "<strong>省略长度的初始化，编译器自动根据值的个数确定长度</strong>。初始化了5个值，所以长度是5。sizeof(a)=20，sizeof(int)=4，20÷4=5。"}, {"id": 6, "type": "single", "kp": "内存分配", "text": "int a[5]; 如果 a[0] 的地址是 100，那么 a[3] 的地址是？（int占4字节）", "options": ["103", "112", "115", "107"], "correct": "B", "expl": "<strong>a[i]的地址 = 首地址 + i × sizeof(int)</strong>。a[3] = 100 + 3×4 = 100 + 12 = 112。"}, {"id": 7, "type": "single", "kp": "越界", "text": "数组越界可能导致的后果是？", "options": ["编译器报错", "程序正常运行（一定不会有问题）", "读到垃圾值或程序崩溃", "数组自动扩容"], "correct": "C", "expl": "<strong>C语言不检查数组越界</strong>，编译器不会报错。越界读会读到垃圾值，越界写可能修改其他变量或导致程序崩溃。非常危险！"}, {"id": 8, "type": "single", "kp": "找最大值", "text": "找数组最大值的算法，正确的做法是？", "options": ["max = 0; 遍历比较", "max = a[0]; 从i=1开始遍历比较", "max = a[n-1]; 从i=0开始遍历比较", "随便选一个元素当max就行"], "correct": "B", "expl": "<strong>应该假设第一个元素是最大值，然后从第二个元素开始比较</strong>。如果选0当max，当所有元素都是负数时结果就错了。从i=1开始效率最高。"}, {"id": 9, "type": "single", "kp": "逆序", "text": "用首尾交换法对n个元素逆序，需要交换几次？", "options": ["n次", "n-1次", "n/2次", "n²次"], "correct": "C", "expl": "<strong>只需交换n/2次</strong>。第i个和第n-1-i个交换，交换一半就完成逆序了。"}, {"id": 10, "type": "single", "kp": "冒泡排序", "text": "对10个数冒泡排序，需要几轮比较？", "options": ["10轮", "9轮", "5轮", "1轮"], "correct": "B", "expl": "<strong>n个数需要n-1轮</strong>。每轮确定一个数的最终位置，10个数需要9轮。"}, {"id": 11, "type": "single", "kp": "冒泡排序", "text": "冒泡排序第i轮（i从0开始），比较几次？", "options": ["n次", "n-1次", "n-1-i次", "i次"], "correct": "C", "expl": "<strong>第i轮比较n-1-i次</strong>。因为前i轮已经确定了i个数在最终位置（最后面），不需要再比较了。"}, {"id": 12, "type": "single", "kp": "输入输出", "text": "输入10个数到数组a，正确的写法是？", "options": ["for(i=0; i<10; i++) scanf(\"%d\", a[i]);", "for(i=0; i<10; i++) scanf(\"%d\", &a[i]);", "for(i=1; i<=10; i++) scanf(\"%d\", &a[i]);", "scanf(\"%d\", a);"], "correct": "B", "expl": "<strong>scanf需要地址符&</strong>。A选项漏掉&，错误；C选项下标从1开始到10，越界了；D选项不能整体输入。"}, {"id": 13, "type": "judge", "kp": "数组定义", "text": "int a[10]; 定义了一个包含10个元素的数组，最大下标是10。", "correct": "B", "options": ["正确", "错误"], "expl": "<strong>错误！</strong>最大下标是9。下标从0开始，范围0~9。"}, {"id": 14, "type": "judge", "kp": "数组初始化", "text": "int a[5]; 如果不初始化，数组元素的值都是0。", "correct": "B", "options": ["正确", "错误"], "expl": "<strong>错误！</strong>局部数组如果不初始化，元素的值是不确定的垃圾值。全局数组才会自动初始化为0。"}, {"id": 15, "type": "judge", "kp": "数组越界", "text": "C语言编译器会自动检查数组下标是否越界。", "correct": "B", "options": ["正确", "错误"], "expl": "<strong>错误！</strong>C语言不检查数组越界，这是C语言的设计特点（追求效率），也是很多bug的来源。程序员必须自己保证不越界。"}, {"id": 16, "type": "judge", "kp": "数组名", "text": "数组名 a 是一个常量，不能被赋值。", "correct": "A", "options": ["正确", "错误"], "expl": "<strong>正确！</strong>数组名是常量指针，代表数组首地址，不能被修改。不能写 a = ... 这样的赋值语句。"}, {"id": 17, "type": "judge", "kp": "冒泡排序", "text": "优化版冒泡排序中，如果某一轮没有发生任何交换，说明数组已经有序，可以提前结束。", "correct": "A", "options": ["正确", "错误"], "expl": "<strong>正确！</strong>这就是优化版冒泡排序的核心思想。用flag标记每轮是否发生交换，没有交换就说明有序，break提前结束。"}, {"id": 18, "type": "fill", "kp": "数组基础", "text": "int a[5]; 数组名是 <input class=\"fill-blank\" data-idx=\"0\" placeholder=\"?\">，长度是 <input class=\"fill-blank\" data-idx=\"1\" placeholder=\"?\">，最大下标是 <input class=\"fill-blank\" data-idx=\"2\" placeholder=\"?\">。", "correct": ["a", "A"], "correctText": "a | 5 | 4", "expl": "<strong>数组名是 a，长度是 5，最大下标是 4（下标从0开始，5-1=4）</strong>。", "correct2": ["5"], "correct3": ["4"]}, {"id": 19, "type": "fill", "kp": "动态长度", "text": "动态获取数组长度的公式是：sizeof(<input class=\"fill-blank\" data-idx=\"0\" placeholder=\"?\">) / sizeof(<input class=\"fill-blank\" data-idx=\"1\" placeholder=\"?\">)。", "correct": ["a", "A", "数组名"], "correctText": "数组名 | 元素类型 或 a[0]", "expl": "<strong>sizeof(数组名) / sizeof(元素类型)</strong>，或者 sizeof(a) / sizeof(a[0])。推荐第二种，类型变了也不用改。", "correct2": ["int", "a[0]", "A[0]"]}, {"id": 20, "type": "fill", "kp": "冒泡排序", "text": "n个数的冒泡排序，共需要 <input class=\"fill-blank\" data-idx=\"0\" placeholder=\"?\"> 轮，第i轮比较 <input class=\"fill-blank\" data-idx=\"1\" placeholder=\"?\"> 次。", "correct": ["n-1", "N-1", "n - 1", "N - 1"], "correctText": "n-1 | n-1-i", "expl": "<strong>n个数需要 n-1 轮，第 i 轮比较 n-1-i 次</strong>。每轮确定一个数的最终位置。", "correct2": ["n-1-i", "N-1-i", "n - 1 - i"]}];

const extraQuestions = [];



let currentQuestions = [];

let currentQIndex = 0;

let answers = {};
let submitted = {};

let currentMode = 'normal';

const PROGRESS_KEY = QUIZ_KEY + '_progress';



function getWrongBank(){

  try{return JSON.parse(localStorage.getItem(QUIZ_KEY)||'[]')}catch(e){return []}

}

function saveWrongBank(list){

  localStorage.setItem(QUIZ_KEY, JSON.stringify(list));

}

function addToWrongBank(q, userAns){

  const bank = getWrongBank();

  if(!bank.find(x=>x.id===q.id)){

    bank.push({

      id:q.id,type:q.type,kp:q.kp,text:q.text,

      options:q.options,correct:q.correct,correctText:q.correctText,

      expl:q.expl,userAns:userAns,time:Date.now()

    });

    saveWrongBank(bank);

  }

}

function saveProgress(){

  if(currentMode==='review') return;

  const prog = {

    mode:currentMode, index:currentQIndex, answers:answers,

    ids:currentQuestions.map(q=>q.id), time:Date.now()

  };

  localStorage.setItem(PROGRESS_KEY, JSON.stringify(prog));

}

function loadProgress(){

  try{return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null')}catch(e){return null}

}

function clearProgress(){

  localStorage.removeItem(PROGRESS_KEY);

}

function shuffle(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;

}



function openInVSCode(q) {

  const code = q.answer || q.hint || '// 请在此编写代码';

  const blob = new Blob([code], {type: 'text/plain'});

  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');

  a.href = url;

  a.download = `Day${DAY_NUM}_${q.id}.c`;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);

  

  // 显示提示

  const info = document.createElement('div');

  info.className = 'vscode-info';

 Open File → 选择下载的 ${a.download}</code><br>或按快捷键 <code>Ctrl+O</code>`;

  const container = document.getElementById('quizContainer');

  const oldInfo = container.querySelector('.vscode-info');

  if (oldInfo) oldInfo.remove();

  container.querySelector('.question-card').appendChild(info);

}



function startQuiz(mode){

  clearProgress();

  currentMode = mode;

  currentQIndex = 0;

  answers = {};

  submitted = {};

  document.getElementById('resultCard').classList.remove('show');

  document.getElementById('reviewArea').style.display = 'none';

  document.getElementById('quizArea').style.display = 'block';

  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));

  const tabMap = {normal:0, coding:1, wrongredo:2, review:3};

  if(tabMap[mode]!==undefined) document.querySelectorAll('.mode-tab')[tabMap[mode]].classList.add('active');



  if(mode==='coding'){

    currentQuestions = [...codingQuestions];

  } else if(mode==='wrongredo'){

    const bank = getWrongBank();

    if(bank.length===0){

      alert('错题库为空，没有错题可以重做！');

      switchMode('normal');

      return;

    }

    currentQuestions = bank.map(w=>({...w, isWrongRedo:true}));

  } else if(mode==='consolidate'){

    const bank = getWrongBank();

    if(bank.length===0){

      alert('错题库为空，先去做题吧！');

      switchMode('normal');

      return;

    }

    const weakKps = [...new Set(bank.map(w=>w.kp))];

    let pool = allQuestions.filter(q=>weakKps.includes(q.kp) && !bank.find(w=>w.id===q.id));

    if(pool.length<5) pool = allQuestions.filter(q=>!bank.find(w=>w.id===q.id));

    currentQuestions = shuffle(pool).slice(0, Math.min(10, pool.length));

  } else {

    currentQuestions = [...allQuestions];

  }



  if(currentQuestions.length===0){

    alert('没有题目！');

    return;

  }

  renderQuestion();

}



function switchMode(mode){

  if(mode==='review'){

    document.getElementById('quizArea').style.display='none';

    document.getElementById('resultCard').classList.remove('show');

    document.getElementById('reviewArea').style.display='block';

    document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));

    document.querySelectorAll('.mode-tab')[3].classList.add('active');

    currentMode='review';

    renderReview();

    return;

  }

  startQuiz(mode);

}

  saveProgress();

  let html = `<div class="question-card">`;

    html += `<button class="btn btn-vscode" onclick="openInVSCode(currentQuestions[currentQIndex])">📂 在VSCode中打开</button>`;

    html += `<button class="btn btn-secondary" onclick="showHint()">💡 提示</button>`;

    html += `<button class="btn btn-warn" onclick="showAnswerCoding()">📖 参考答案</button>`;

    html += `</div>`;

    html += `<div class="hint-box" id="hintBox">💡 ${q.hint}</div>`;

    html += `<div class="test-result" id="testResult"></div>`;

    html += `<div class="answer-display" id="answerDisplay"><strong>参考答案：</strong><pre>${q.answer.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre></div>`;

  } else {

    html += `<div class="question-text">${q.text}</div>`;

    if(q.type==='single' || q.type==='judge'){

      html += `<div class="options">`;

      const labels = q.type==='judge'?['A','B']:['A','B','C','D'];

      q.options.forEach((opt,i)=>{

        if(isSubmitted){

          const cls = labels[i]===q.correct?'correct':(labels[i]===answers[q.id]?'wrong':'');

          html += `<div class="option ${cls}" style="pointer-events:none" onclick=""><span class="option-label">${labels[i]}.</span>${opt}</div>`;

        } else {

          const sel = answers[q.id]===labels[i]?'selected':'';

          html += `<div class="option ${sel}" onclick="selectOption('${labels[i]}', event)"><span class="option-label">${labels[i]}.</span>${opt}</div>`;

        }

      });

      html += `</div>`;

    } else if(q.type==='fill'){

      html += `<div class="question-text">${q.text}</div>`;

    }

  }

  html += `<div class="explanation${isSubmitted?' show':''}" id="expl"><div class="explanation-title">${isSubmitted?(submitted[q.id]?'✅ 正确':'❌ 错误'):'📖 解析'}</div>${q.expl||''}</div>`;

  html += `<div class="btn-group">`;

  if(currentQIndex>0) html += `<button class="btn" onclick="prevQ()">上一题</button>`;

  if(q.type==='coding'){

</button>`;

  } else {

    if(isSubmitted){

</button>`;

      else html += `<button class="btn btn-primary" onclick="goNext()">🏁 查看成绩</button>`;

    } else {

      html += `<button class="btn btn-primary" onclick="submitQ()">提交答案</button>`;

    }

  }

  html += `</div></div>`;

  document.getElementById('quizContainer').innerHTML = html;



  if(q.type==='fill' && isSubmitted){

    const userAns = answers[q.id]||[];

    document.querySelectorAll('.fill-blank').forEach((inp,i)=>{

      inp.disabled = true;

      if(userAns[i] && userAns[i].toLowerCase()===q.correct[i].toLowerCase()){

        inp.style.background='#d4edda';inp.style.borderColor='#27ae60';

      } else {

        inp.style.background='#f8d7da';inp.style.borderColor='#e74c3c';

        inp.title = '正确答案: '+q.correct[i];

      }

    });

  }

}



function selectOption(label, e){

  const q = currentQuestions[currentQIndex];

  answers[q.id] = label;

  document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));

  e.currentTarget.classList.add('selected');

}



function showHint(){

  document.getElementById('hintBox').classList.toggle('show');

}

function showAnswerCoding(){

  document.getElementById('answerDisplay').classList.toggle('show');

}



function submitQ(){

  const q = currentQuestions[currentQIndex];

  let userAns = answers[q.id];

  let isCorrect = false;



  if(q.type==='fill'){

    const inputs = document.querySelectorAll('.fill-blank');

    userAns = Array.from(inputs).map(i=>i.value.trim());

    isCorrect = q.correct.every((c,i)=>userAns[i] && userAns[i].toLowerCase()===c.toLowerCase());

    if(!isCorrect) addToWrongBank(q, userAns.join(' | '));

  } else {

    if(!userAns){

      alert('请先选择一个答案！');

      return;

    }

    isCorrect = userAns===q.correct;

    if(!isCorrect) addToWrongBank(q, userAns||'未作答');

  }



  submitted[q.id] = isCorrect;

  saveProgress();

  renderQuestion();

}



function prevQ(){

  if(currentQIndex>0){currentQIndex--;renderQuestion()}

}

function goNext(){
  if(currentQIndex < currentQuestions.length - 1){
    currentQIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
  window.scrollTo(0,0);
}

function nextQ(){

  if(currentQIndex<currentQuestions.length-1){currentQIndex++;renderQuestion()}

  else finishQuiz();

}



function finishQuiz(){

  saveProgress();

  let correct=0, wrongList=[];

  currentQuestions.forEach(q=>{

    if(q.type==='coding') return;

    const ua = answers[q.id];

    let ok=false;

    if(q.type==='fill'){

      const ual = (ua||[]);

      ok = Array.isArray(ual) && q.correct.every((c,i)=>ual[i] && ual[i].toLowerCase()===c.toLowerCase());

    } else { ok = ua===q.correct; }

    if(ok) correct++; else wrongList.push({q,userAns:Array.isArray(ua)?ua.join(' | '):(ua||'未作答')});

  });



  const total = currentQuestions.filter(q=>q.type!=='coding').length;

  const wrong = total - correct;

  const score = total>0 ? Math.round(correct/total*100) : 0;



  document.getElementById('quizArea').style.display='none';

  document.getElementById('resultCard').classList.add('show');

  document.getElementById('score').textContent = score;

  document.getElementById('score').style.color = score>=90?'#27ae60':score>=60?'#f39c12':'#e74c3c';

  document.getElementById('message').textContent = score>=90?'🎉 太棒了！掌握得很好！':score>=60?'👍 继续努力，还有提升空间！':'💪 基础还需加强，多复习知识点！';

  document.getElementById('correctCount').textContent = correct;

  document.getElementById('wrongCount').textContent = wrong;

  document.getElementById('totalCount').textContent = total;



  if(wrongList.length>0){

    document.getElementById('wrongBankPreview').style.display='block';

    let html='';

    wrongList.forEach(w=>{

      html += `<div class="wrong-item"><div class="wq">${w.q.kp}: ${w.q.text.substring(0,50)}...</div><div class="wa">你的答案: ${w.userAns}</div><div class="wc">正确答案: ${w.q.correctText||w.q.correct}</div></div>`;

    });

    document.getElementById('wrongPreviewList').innerHTML = html;

  } else {

    document.getElementById('wrongBankPreview').style.display='none';

  }

  clearProgress();

}



function renderReview(){

  const bank = getWrongBank();

  document.getElementById('wrongBankCount').textContent = bank.length;

  switchReviewTab('list');

}



function switchReviewTab(tab, e){

  document.querySelectorAll('.review-tab').forEach(t=>t.classList.remove('active'));

  e?.target?.classList.add('active');

  if(!e) document.querySelectorAll('.review-tab')[tab==='list'?0:1].classList.add('active');

  document.getElementById('wrongBankList').style.display = tab==='list'?'block':'none';

  document.getElementById('knowledgeReview').style.display = tab==='knowledge'?'block':'none';

  if(tab==='list') renderWrongList();

  else renderKnowledgeReview();

}



function renderWrongList(){

  const bank = getWrongBank();

  const el = document.getElementById('wrongBankList');

  if(bank.length===0){el.innerHTML='<div class="empty-state">暂无错题，继续加油！</div>';return}

  let html='';

  bank.sort((a,b)=>b.time-a.time).forEach((w,i)=>{

    html += `<div class="kp-section" style="border-left-color:#e74c3c">`;

    html += `<div class="kp-header"><div class="kp-title">${i+1}. ${w.kp}</div>`;

    html += `<button class="btn" style="background:#e74c3c;color:white;padding:3px 10px;font-size:11px" onclick="removeWrong(${w.id})">删除</button></div>`;

    html += `<div class="kp-content">${w.text}</div>`;

    if(w.options){

      html += `<div class="options" style="margin-top:8px">`;

      const labels = w.type==='judge'?['A','B']:['A','B','C','D'];

      w.options.forEach((opt,j)=>{

        const cls = labels[j]===w.correct?'correct':(labels[j]===w.userAns?'wrong':'');

        html += `<div class="option ${cls}" style="cursor:default;pointer-events:none"><span class="option-label">${labels[j]}.</span>${opt}</div>`;

      });

      html += `</div>`;

    }

    html += `<div class="explanation show"><div class="explanation-title">📖 解析</div>${w.expl||''}</div>`;

    html += `</div>`;

  });

  el.innerHTML = html;

}



function removeWrong(id){

  if(!confirm('确定删除这道错题吗？')) return;

  const bank = getWrongBank().filter(w=>w.id!==id);

  saveWrongBank(bank);

  renderReview();

}



function clearWrongBank(){

  if(!confirm('确定清空所有错题吗？此操作不可恢复！')) return;

  saveWrongBank([]);

  renderReview();

}



function renderKnowledgeReview(){

  const bank = getWrongBank();

  const el = document.getElementById('knowledgeReview');

  if(bank.length===0){el.innerHTML='<div class="empty-state">暂无错题，继续加油！</div>';return}



  const kpCount = {};

  bank.forEach(w=>{kpCount[w.kp]=(kpCount[w.kp]||0)+1});

  const sorted = Object.entries(kpCount).sort((a,b)=>b[1]-a[1]);



  let html = `<p style="font-size:13px;color:#666;margin-bottom:12px">按错误频率排序，共 ${sorted.length} 个薄弱知识点</p>`;

  sorted.forEach(([kp,count])=>{

    const info = kpMap[kp] || {title:kp, content:'暂无详细说明，请看教材。'};

    const related = bank.filter(w=>w.kp===kp);

    html += `<div class="kp-section">`;

    html += `<div class="kp-header"><div class="kp-title">${info.title}</div><span class="kp-badge">错 ${count} 次</span></div>`;

    html += `<div class="kp-content">${info.content}</div>`;

    html += `<div class="kp-wrong-list">相关错题：<br>`;

    related.forEach(r=>{

      html += `• ${r.text.substring(0,60)}${r.text.length>60?'...':''}<br>`;

    });

    html += `</div></div>`;

  });

  el.innerHTML = html;

}



window.addEventListener('beforeunload', saveProgress);



(function(){

  const p = loadProgress();

  if(p && p.mode && p.ids && p.ids.length>0 && Date.now()-p.time < 3600000){

    if(confirm('检测到上次未完成的答题进度，是否恢复？')){

      currentMode = p.mode;

      currentQIndex = p.index;

      answers = p.answers || {};

      let pool;

      if(p.mode==='coding') pool = codingQuestions;

      else pool = allQuestions;

      currentQuestions = p.ids.map(id=>pool.find(q=>q.id===id)).filter(Boolean);

      if(currentQuestions.length>0){

        document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));

        const tm = {normal:0,coding:1,wrongredo:2};

        if(tm[p.mode]!==undefined) document.querySelectorAll('.mode-tab')[tm[p.mode]].classList.add('active');

        renderQuestion();

        return;

      }

    }

    clearProgress();

  }

  startQuiz('normal');

})();

</script>
